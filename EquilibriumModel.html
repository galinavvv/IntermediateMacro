<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermediate Macroeconomics — Equilibrium model practice</title>
<style>
  :root{
    --ink:#1A1A1C; --accent:#1F3A6E; --budget:#15607A; --ic:#B21F35;
    --note:#8A6212; --muted:#6B6E76; --rule:#D8DCE3; --paper:#FDFCFA;
    --panel:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",
                Georgia,serif;
    line-height:1.5; padding:1.5rem 1rem 4rem;
  }
  .wrap{max-width:46rem;margin:0 auto}
  header{border-top:3px solid var(--accent);padding-top:.9rem;margin-bottom:1.6rem}
  h1{font-size:1.5rem;margin:0 0 .2rem;color:var(--accent);letter-spacing:.01em}
  .sub{color:var(--muted);font-style:italic;font-size:.95rem;margin:0}
  .card{
    background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:1.2rem 1.3rem;margin-bottom:1.1rem;
  }
  .stem{font-size:1.06rem;margin:0 0 1rem}
  .qmeta{color:var(--muted);font-size:.82rem;letter-spacing:.04em;
         text-transform:uppercase;margin:0 0 .5rem}
  ul.options{list-style:none;margin:0;padding:0}
  ul.options li{margin:0 0 .5rem}
  button.opt{
    width:100%;text-align:left;font:inherit;font-size:1rem;
    background:#fff;border:1px solid var(--rule);border-radius:2px;
    padding:.62rem .8rem;cursor:pointer;color:var(--ink);
    display:flex;gap:.6rem;align-items:baseline;
  }
  button.opt:hover:not(:disabled){border-color:var(--budget);background:#F4F9FB}
  button.opt:disabled{cursor:default}
  button.opt .tag{color:var(--muted);font-variant:small-caps;min-width:1.2rem}
  button.opt.wrong{background:#FBF1F2;border-color:var(--ic);color:#8B4148;
                   text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.right{background:#EFF6F8;border-color:var(--budget);color:var(--budget);
                   font-weight:600}
  .verdict{margin:1rem 0 0;padding:.7rem .85rem;font-size:.97rem;border-left:3px solid}
  .verdict.ok{border-color:var(--budget);background:#EFF6F8}
  .verdict.no{border-color:var(--ic);background:#FBF1F2}
  .verdict b{display:block;margin-bottom:.15rem}
  .btn{
    font:inherit;font-size:1rem;padding:.62rem 1.15rem;border-radius:2px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  }
  .btn:hover{background:#162C55}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:#F2F5FA}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--rule)}
  .btn.quiet:hover{background:#F6F6F4;color:var(--ink)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.1rem}
  .spacer{flex:1}
  .bar{height:4px;background:var(--rule);margin:.3rem 0 1.4rem;overflow:hidden}
  .bar > div{height:100%;background:var(--budget);width:0;transition:width .25s}
  table.stats{border-collapse:collapse;width:100%;margin:.4rem 0 .2rem}
  table.stats td{padding:.42rem .2rem;border-bottom:1px solid var(--rule);font-size:1rem}
  table.stats td.n{text-align:right;font-weight:700;color:var(--accent);width:3.5rem}
  table.stats tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:.9rem}
  em.v{font-style:italic}
  footer{margin-top:2.2rem;color:var(--muted);font-size:.82rem;
         border-top:1px solid var(--rule);padding-top:.7rem}
  footer a{color:var(--muted)} footer a:hover{color:var(--accent)}
  @media (max-width:480px){ body{padding:1rem .7rem 3rem} h1{font-size:1.3rem} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Equilibrium model — practice</h1>
  <p class="sub">Intermediate Macroeconomics</p>
</header>

<div id="app"></div>

<footer>
  <a href="index.html">All practice quizzes</a> &middot;
  Your progress is saved in this browser, on this device only. Nothing is sent
  anywhere.
</footer>

</div>

<script>
/* ------------------------------------------------------------------ questions
   Order follows the notes: the three agents, labor market equilibrium, goods market, testing.
   correct = index into options.                                              */
const QUESTIONS = [
  {stem:"Which agents does the equilibrium model bring together?",
   options:["A consumer, a firm and a government",
            "A consumer, a firm and a central bank",
            "A consumer, a firm and the rest of the world",
            "A consumer, a firm and a financial sector"],
   correct:0,
   why:"The model adds a government to the consumer and the firm. It has no central bank, no financial sector and no rest of the world."},

  {stem:"In our benchmark one-period model with a consumer, a firm and a government, how does the government pay for its spending <em class='v'>G</em>?",
   options:["It borrows now and repays in a later period",
            "It sets the lump-sum tax so that revenue exactly covers <em class='v'>G</em>",
            "It taxes the firm's profit before it is paid out as dividends",
            "It prints money to pay for <em class='v'>G</em>"],
   correct:1,
   why:"There is only one period, so there is no later period in which to repay a debt, and the model has no money. The government's budget constraint says that the lump-sum tax <em class='v'>T</em> equals <em class='v'>G</em>."},

  {stem:"In the consumer's budget constraint, where does the dividend income &pi; come from?",
   options:["A transfer from the government",
            "Savings carried over from an earlier period",
            "Interest on bonds that the consumer holds",
            "The firm's profit, which it pays out to the consumer"],
   correct:3,
   why:"The consumer owns the firm, so its profit is paid out to her as dividends. It is the same &pi; that the firm earns when it maximizes profit. There is no earlier period to save from."},

  {stem:"The consumer takes the dividend &pi; as given. In the equilibrium model, this means that&hellip;",
   options:["&pi; is a parameter that the researcher sets outside the model",
            "&pi; is chosen by the government when it sets the tax",
            "she cannot affect &pi;, although the model determines it",
            "&pi; is fixed at its level in the previous period"],
   correct:2,
   why:"Taking something as given means that an agent cannot affect it, not that it is fixed. The wage, the dividend and the tax are all given to the consumer, yet the labor market, the firm's problem and the government's budget constraint determine them inside the model."},

  {stem:"What does government spending <em class='v'>G</em> represent in the equilibrium model?",
   options:["Spending on education that raises the skills of workers",
            "Spending on research and development that raises TFP",
            "Institutions: law enforcement, the legal system and defense",
            "Public goods, such as parks, that consumers enjoy directly"],
   correct:2,
   why:"<em class='v'>G</em> pays for what lets the economy work as described: property rights, no cheating or stealing, safety from invasion and competitive markets. It does not raise productivity or utility. In a richer model, parts of <em class='v'>G</em> could do those things."},

  {stem:"In a richer model, suppose part of government spending goes to public parks that consumers enjoy. Where would that part enter the model?",
   options:["In TFP, raising output per unit of inputs",
            "In the budget constraint, raising the value of an hour of work",
            "In the production function, as extra capital",
            "In the utility function, next to consumption and leisure"],
   correct:3,
   why:"Something consumers enjoy directly belongs in utility. Spending on innovation would instead raise TFP, and spending on education would raise skills, which enter the budget constraint."},

  {stem:"In the labor market of the equilibrium model, the equilibrium wage is the wage at which&hellip;",
   options:["the firm's profit is exactly zero",
            "the consumer works all of her time endowment <em class='v'>h</em>",
            "the hours supplied equal the hours demanded",
            "the wage bill is equal to total output"],
   correct:2,
   why:"At the equilibrium wage the labor supply curve and the labor demand curve cross: the consumer's plan and the firm's plan agree. Neither zero profit, nor working all of <em class='v'>h</em>, nor a wage bill equal to output is part of that definition."},

  {stem:"Why does the labor market in the equilibrium model have exactly one equilibrium wage?",
   options:["Both curves are downward-sloping, so they cross exactly once",
            "The government sets the wage at the level where the two curves cross",
            "The wage is a parameter that the researcher chooses outside the model",
            "Supply is upward-sloping and demand is downward-sloping, so the curves cross once"],
   correct:3,
   why:"With labor supply upward-sloping and labor demand downward-sloping, the curves cannot cross more than once. The wage is not set by the government or by the researcher: it is determined by the market."},

  {stem:"Which equilibrium variables does the labor market equilibrium itself determine?",
   options:["The wage and output",
            "The wage and hours worked",
            "Hours worked and dividends",
            "Output and consumption"],
   correct:1,
   why:"The labor market determines the wage and hours worked. The other equilibrium variables, such as output, profit, the tax and consumption, then follow from the three agents' problems."},

  {stem:"In the equilibrium model, once the labor market has determined hours worked, where does equilibrium output come from?",
   options:["The goods market, which has to clear first",
            "The consumer's budget constraint",
            "The production function, evaluated at those hours",
            "The government's budget constraint"],
   correct:2,
   why:"Output is what the firm produces with its capital and the equilibrium hours. The goods market does not have to be solved first: it takes care of itself once the labor market is in equilibrium."},

  {stem:"In the equilibrium model, which of the following is determined inside the model, rather than set outside it?",
   options:["Government spending <em class='v'>G</em>",
            "The time endowment <em class='v'>h</em>",
            "Total factor productivity <em class='v'>z</em>",
            "The lump-sum tax <em class='v'>T</em>"],
   correct:3,
   why:"<em class='v'>G</em>, <em class='v'>h</em> and <em class='v'>z</em> are parameters, along with capital and the functions <em class='v'>u</em> and <em class='v'>F</em>. The tax <em class='v'>T</em> is a policy that the government sets to cover <em class='v'>G</em>, so it is one of the model's predictions."},

  {stem:"The goods market in the equilibrium model is in equilibrium when&hellip;",
   options:["output equals consumption plus investment",
            "output equals consumption plus government spending",
            "output equals consumption plus net exports",
            "output equals consumption plus dividends"],
   correct:1,
   why:"Firms supply output, and consumers and the government buy it. This is GDP by expenditure, <em class='v'>Y</em> = <em class='v'>C</em> + <em class='v'>G</em> + <em class='v'>I</em> + <em class='v'>NX</em>, with <em class='v'>I</em> = 0 and <em class='v'>NX</em> = 0 in this model."},

  {stem:"Why are investment and net exports both zero in the equilibrium model that we studied in class?",
   options:["There is only one period, so nothing is invested, and there is no rest of the world",
            "Firms use no capital in production, and the government runs a balanced budget",
            "Consumers spend all of their income, and taxes are equal to government spending",
            "Capital does not depreciate, and the economy has no financial sector for saving"],
   correct:0,
   why:"The model has a single period, so nobody invests for the future, and it has no rest of the world to trade with. Firms do use capital, and a balanced budget or full spending of income would not make <em class='v'>I</em> or <em class='v'>NX</em> zero."},

  {stem:"Why is the goods market in equilibrium automatically once the labor market is?",
   options:["The price of goods adjusts until supply and demand are equal",
            "The government adjusts its spending until it absorbs any unsold output",
            "Consumers choose consumption to match whatever output firms produce",
            "All output is paid out as income, which is either consumed or taxed and spent"],
   correct:3,
   why:"Follow the flow of funds: output is paid out as wages and dividends, all of it reaches the consumer, who consumes some and pays the rest as the tax that finances <em class='v'>G</em>. Nothing is wasted, so <em class='v'>Y</em> = <em class='v'>C</em> + <em class='v'>G</em>."},

  {stem:"A model has several markets. To be sure that every market is in equilibrium, it is enough to&hellip;",
   options:["check each market separately, since each can fail on its own",
            "check all but one of them, as long as no resources are wasted",
            "check all but one of them, whether or not resources are wasted",
            "check none of them, since markets always clear in an equilibrium model"],
   correct:1,
   why:"This is Walras' law: if all markets but one clear and no resources are wasted, the last one clears automatically. In our model there are two markets, so once the labor market clears, the goods market does too."},

  {stem:"Suppose a model's parameters are chosen so that it matches observations from the data. Why is that not enough to trust its predictions about changes?",
   options:["Observations from the data can never be matched, whatever the parameters",
            "Changes in the data are measured less accurately than levels",
            "A match in levels does not show that the model gets changes right",
            "Policy analysis needs more agents than a consumer, a firm and a government"],
   correct:2,
   why:"Parameters can be chosen to fit levels. To trust predictions about changes, we also want to see that the model replicates some changes seen in the data."},

  {stem:"Which reason makes TFP <em class='v'>z</em> the natural parameter to change in order to create a boom or a recession in the equilibrium model?",
   options:["It is the only parameter that has an effect on equilibrium output",
            "Business cycles tend to be supply-driven, and TFP is measurable",
            "It is the only parameter that the government can change",
            "It is the only parameter that the firm takes as given in its problem"],
   correct:1,
   why:"TFP directly influences supply, and business cycles tend to be supply-driven. More importantly, we can measure TFP from the data and study its business cycle properties. Capital, the time endowment and government spending also affect output, so TFP is not the only one."},

  {stem:"The Solow residual is observed output divided by observed capital and hours raised to powers &alpha; and 1 &minus; &alpha;. It is called a residual because&hellip;",
   options:["it is what is left of output after the firm has paid its workers",
            "it is what is left of output after consumption and government spending",
            "it is the part of output that remains after removing the trend",
            "it is the part of output that the measured inputs do not explain"],
   correct:3,
   why:"Capital and hours are measured; whatever part of output they do not account for is the residual, and we read it as TFP. What is left after paying workers is profit, and detrending is a separate step."},

  {stem:"The Solow residual is procyclical. This means that&hellip;",
   options:["it is below its trend when GDP is above its trend, and above it when GDP is below",
            "it is above its trend when GDP is above its trend, and below it when GDP is below",
            "it grows over time as fast as GDP does",
            "it stays at its trend whatever GDP does"],
   correct:1,
   why:"A variable is procyclical if it is above its trend when GDP is above its trend and below it when GDP is below. The plot of the two deviations from trend moves together."},

  {stem:"For the equilibrium model to be consistent with business cycle data, a rise in TFP <em class='v'>z</em> has to generate&hellip;",
   options:["a rise in output and consumption, but no change in employment",
            "a rise in output and employment, but a fall in consumption",
            "a rise in output, but a fall in consumption and employment",
            "a rise in output, in consumption and in employment"],
   correct:3,
   why:"Output rises because the Solow residual is procyclical: TFP and output move together. Consumption and employment are procyclical too, so the model must make them rise along with output."}
];

/* ---------------------------------------------------------------- state */
const LETTERS = ["a","b","c","d","e","f"];
const app = document.getElementById("app");

let learned, everWrong, queue, order, seen, firstTry, relearned, wrongHere, answered;

/* Progress is kept in this browser only, under one key. A question counts as
   mastered once it has been answered correctly at the first attempt of a
   showing; missing it puts it back to "shaky" until that happens.            */
const STORE_KEY = "ecn313-equilibrium-model-v1";
let mastered;            // stored: answered right at the first attempt, persisted
let touched;             // stored: has been seen at some point
let sessionResult;       // this session only: qid -> true/false, not yet saved
let savedThisVisit;      // has the student pressed Save during this visit

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.mastered) && o.mastered.length === QUESTIONS.length
         && Array.isArray(o.touched) && o.touched.length === QUESTIONS.length){
        mastered = o.mastered.slice(); touched = o.touched.slice(); return true;
      }
    }
  }catch(e){}
  return false;
}
/* What the stored record would become if the student chooses to save. */
function mergedMastered(){
  return mastered.map((m,i)=> i in sessionResult ? sessionResult[i] : m);
}
function mergedTouched(){
  return touched.map((t,i)=> (i in sessionResult) ? true : t);
}
function saveStore(){
  mastered = mergedMastered();
  touched  = mergedTouched();
  try{
    localStorage.setItem(STORE_KEY,
      JSON.stringify({mastered, touched, saved:Date.now()}));
    return true;
  }catch(e){ return false; }
}
function clearStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  mastered = new Array(QUESTIONS.length).fill(false);
  touched  = new Array(QUESTIONS.length).fill(false);
}
function hasHistory(){ return touched.some(Boolean); }
function notMastered(){ return QUESTIONS.map((_,i)=>i).filter(i=>!mastered[i]); }

function resetAll(){
  learned  = new Array(QUESTIONS.length).fill(false);
  everWrong= new Array(QUESTIONS.length).fill(false);
}

function initStore(){
  if(!loadStore()){
    mastered = new Array(QUESTIONS.length).fill(false);
    touched  = new Array(QUESTIONS.length).fill(false);
  }
}

function startSession(pool){
  queue = pool.slice();
  seen = new Set(); firstTry = new Set(); relearned = new Set();
  sessionResult = {}; savedThisVisit = false;
  nextQuestion();
}

function nextQuestion(){
  if(queue.length === 0){ renderEnd(true); return; }
  wrongHere = 0; answered = false;
  const qid = queue[0];
  order = shuffled(QUESTIONS[qid].options.map((_,i)=>i));
  renderQuestion(qid);
}

function shuffled(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

/* --------------------------------------------------------------- screens */
function renderHome(){
  const done = mastered.filter(Boolean).length;
  const left = notMastered();

  if(hasHistory()){
    app.innerHTML = `
      <div class="card">
        <p class="qmeta">Saved progress found on this device</p>
        <p class="stem">Last time you answered <b>${done}</b> of
          ${QUESTIONS.length} questions correctly at the first attempt.
          What would you like to practise?</p>
        <div class="row">
          ${left.length
            ? `<button class="btn" id="go-left">Only the ${left.length} I have not learned</button>`
            : ``}
          <button class="btn ${left.length ? "ghost" : ""}" id="go-all">All ${QUESTIONS.length} questions</button>
        </div>
        <div class="row">
          <button class="btn quiet" id="forget">Clear saved progress</button>
        </div>
        <p class="note" style="margin-top:.9rem">Progress is kept in this
          browser, on this device only, and never leaves it.</p>
      </div>`;
    document.getElementById("go-all").onclick =
      ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
    const bl = document.getElementById("go-left");
    if(bl) bl.onclick = ()=>{ resetAll(); startSession(left); };
    document.getElementById("forget").onclick =
      ()=>{ clearStore(); resetAll(); renderHome(); };
    return;
  }

  app.innerHTML = `
    <div class="card">
      <p class="stem">Twenty questions on the equilibrium model, in the order
        the notes cover them. Get one right first time and it is done. Get it
        wrong and you keep choosing until you find the answer &mdash; then that
        question comes back later in the session.</p>
      <p class="note">At the end you can save your progress on this device, so
        that next time you can practise just the ones you have not learned.</p>
      <div class="row">
        <button class="btn" id="go-all">Start practice session</button>
      </div>
    </div>`;
  document.getElementById("go-all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
}

function renderQuestion(qid){
  const q = QUESTIONS[qid];
  const total = QUESTIONS.length;
  const doneCount = learned.filter(Boolean).length;
  app.innerHTML = `
    <div class="bar"><div style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
    <div class="card">
      <p class="qmeta">Question ${qid+1} of ${total} &middot; ${queue.length} left this round</p>
      <p class="stem">${q.stem}</p>
      <ul class="options" id="opts">
        ${order.map((oi,pos)=>`
          <li><button class="opt" data-oi="${oi}">
            <span class="tag">(${LETTERS[pos]})</span><span>${q.options[oi]}</span>
          </button></li>`).join("")}
      </ul>
      <div id="verdict"></div>
      <div class="row">
        <div id="advance"></div>
        <div class="spacer"></div>
        <button class="btn quiet" id="end">End session</button>
      </div>
    </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>choose(qid, parseInt(b.dataset.oi,10), b);
  });
  document.getElementById("end").onclick = ()=>renderEnd(false);
}

function choose(qid, oi, btn){
  if(answered) return;
  const q = QUESTIONS[qid];
  const firstShowing = !seen.has(qid);
  seen.add(qid);
  touched[qid] = true;
  const verdict = document.getElementById("verdict");

  if(oi !== q.correct){
    everWrong[qid] = true; wrongHere++;
    sessionResult[qid] = false;
    btn.classList.add("wrong"); btn.disabled = true;
    const left = document.querySelectorAll("#opts .opt:not(:disabled)").length;
    verdict.innerHTML = `<div class="verdict no"><b>Not quite.</b>
      ${left > 1 ? "Try again — pick from what is left."
                 : "One option left; it has to be that one."}</div>`;
    return;
  }

  answered = true;
  btn.classList.add("right");
  document.querySelectorAll("#opts .opt").forEach(b=>b.disabled = true);

  let head, tail;
  if(wrongHere === 0){
    queue.shift();
    learned[qid] = true;
    if(everWrong[qid]){ relearned.add(qid); head = "Right — and that one is learned."; }
    else             { firstTry.add(qid);  head = "Correct, first time."; }
    if(firstShowing && !everWrong[qid] && !(qid in sessionResult)){
      sessionResult[qid] = true;
    }
    tail = "It will not come up again.";
  }else{
    queue.shift(); queue.push(qid);
    head = "That's the one.";
    tail = "This question will come back once the others have been through.";
  }
  verdict.innerHTML = `<div class="verdict ok"><b>${head}</b>${q.why}
    <span class="note"><br>${tail}</span></div>`;
  const adv = document.getElementById("advance");
  adv.innerHTML = `<button class="btn" id="next">${queue.length ? "Next question" : "Finish"}</button>`;
  document.getElementById("next").onclick = nextQuestion;
}

function renderEnd(cleared){
  const attempted = seen.size;
  const clean = firstTry.size;
  const fixed = relearned.size;
  const wouldBe = mergedMastered();
  const wouldLeft = wouldBe.map((m,i)=>i).filter(i=>!wouldBe[i]);
  const doneAfter = wouldBe.filter(Boolean).length;
  const anythingToSave = Object.keys(sessionResult).length > 0;

  app.innerHTML = `
    <div class="card">
      <p class="qmeta">${cleared ? "Round complete" : "Session ended"}</p>
      <p class="stem">${cleared
        ? "Everything in this round has been answered."
        : "Here is how the session went."}</p>
      <table class="stats">
        <tr><td>Questions attempted</td><td class="n">${attempted}</td></tr>
        <tr><td>Answered correctly at the first attempt</td><td class="n">${clean}</td></tr>
        <tr><td>Learned after getting it wrong first</td><td class="n">${fixed}</td></tr>
      </table>

      <div id="savebox">
      ${anythingToSave ? `
        <div class="verdict ok" style="margin-top:1rem">
          <b>Save your progress?</b>
          Saving records which questions you answered correctly at the first
          attempt, so that next time you can practise only the rest. It is kept
          <b>in this browser, on this device only</b> &mdash; nothing is sent
          anywhere.
        </div>
        <div class="row">
          <button class="btn" id="save">Save on this device</button>
          <button class="btn quiet" id="nosave">Don't save</button>
        </div>` : ``}
      </div>

      <div class="row" id="nextsteps">
        <button class="btn ghost" id="again">Practise the ${wouldLeft.length} not yet learned</button>
        <button class="btn ghost" id="all">Practise all ${QUESTIONS.length}</button>
        <button class="btn quiet" id="home">Back to start</button>
      </div>
    </div>`;

  const box = document.getElementById("savebox");
  const bs = document.getElementById("save");
  if(bs) bs.onclick = ()=>{
    const ok = saveStore();
    savedThisVisit = true;
    box.innerHTML = ok
      ? `<div class="verdict ok" style="margin-top:1rem"><b>Saved on this device.</b>
         ${doneAfter} of ${QUESTIONS.length} questions are recorded as learned.
         Next time you open this page you can pick up where you left off.</div>`
      : `<div class="verdict no" style="margin-top:1rem"><b>Could not save.</b>
         Your browser is blocking storage — private browsing usually does this.</div>`;
  };
  const bn = document.getElementById("nosave");
  if(bn) bn.onclick = ()=>{
    box.innerHTML = `<p class="note" style="margin-top:1rem">Nothing saved.
      Closing the page will clear this session.</p>`;
  };

  const againBtn = document.getElementById("again");
  if(wouldLeft.length === 0){ againBtn.remove(); }
  else againBtn.onclick = ()=>{ resetAll(); startSession(wouldLeft); };
  document.getElementById("all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
  document.getElementById("home").onclick = renderHome;
}

initStore();
resetAll();
renderHome();
</script>
</body>
</html>
