<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermediate Macroeconomics — Equilibrium on one graph practice</title>
<style>
  :root{
    --ink:#1A1A1C; --accent:#1F3A6E; --budget:#15607A; --ic:#B21F35;
    --note:#8A6212; --muted:#6B6E76; --rule:#D8DCE3; --paper:#FDFCFA;
    --panel:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",
                Georgia,serif;
    line-height:1.5; padding:1.5rem 1rem 4rem;
  }
  .wrap{max-width:46rem;margin:0 auto}
  header{border-top:3px solid var(--accent);padding-top:.9rem;margin-bottom:1.6rem}
  h1{font-size:1.5rem;margin:0 0 .2rem;color:var(--accent);letter-spacing:.01em}
  .sub{color:var(--muted);font-style:italic;font-size:.95rem;margin:0}
  .card{
    background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:1.2rem 1.3rem;margin-bottom:1.1rem;
  }
  .stem{font-size:1.06rem;margin:0 0 1rem}
  .qmeta{color:var(--muted);font-size:.82rem;letter-spacing:.04em;
         text-transform:uppercase;margin:0 0 .5rem}
  ul.options{list-style:none;margin:0;padding:0}
  ul.options li{margin:0 0 .5rem}
  button.opt{
    width:100%;text-align:left;font:inherit;font-size:1rem;
    background:#fff;border:1px solid var(--rule);border-radius:2px;
    padding:.62rem .8rem;cursor:pointer;color:var(--ink);
    display:flex;gap:.6rem;align-items:baseline;
  }
  button.opt:hover:not(:disabled){border-color:var(--budget);background:#F4F9FB}
  button.opt:disabled{cursor:default}
  button.opt .tag{color:var(--muted);font-variant:small-caps;min-width:1.2rem}
  button.opt.wrong{background:#FBF1F2;border-color:var(--ic);color:#8B4148;
                   text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.right{background:#EFF6F8;border-color:var(--budget);color:var(--budget);
                   font-weight:600}
  .verdict{margin:1rem 0 0;padding:.7rem .85rem;font-size:.97rem;border-left:3px solid}
  .verdict.ok{border-color:var(--budget);background:#EFF6F8}
  .verdict.no{border-color:var(--ic);background:#FBF1F2}
  .verdict b{display:block;margin-bottom:.15rem}
  .btn{
    font:inherit;font-size:1rem;padding:.62rem 1.15rem;border-radius:2px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  }
  .btn:hover{background:#162C55}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:#F2F5FA}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--rule)}
  .btn.quiet:hover{background:#F6F6F4;color:var(--ink)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.1rem}
  .spacer{flex:1}
  .bar{height:4px;background:var(--rule);margin:.3rem 0 1.4rem;overflow:hidden}
  .bar > div{height:100%;background:var(--budget);width:0;transition:width .25s}
  table.stats{border-collapse:collapse;width:100%;margin:.4rem 0 .2rem}
  table.stats td{padding:.42rem .2rem;border-bottom:1px solid var(--rule);font-size:1rem}
  table.stats td.n{text-align:right;font-weight:700;color:var(--accent);width:3.5rem}
  table.stats tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:.9rem}
  em.v{font-style:italic}
  footer{margin-top:2.2rem;color:var(--muted);font-size:.82rem;
         border-top:1px solid var(--rule);padding-top:.7rem}
  footer a{color:var(--muted)} footer a:hover{color:var(--accent)}
  @media (max-width:480px){ body{padding:1rem .7rem 3rem} h1{font-size:1.3rem} }
</style>

<body>
<div class="wrap">

<header>
  <h1>Equilibrium on one graph — practice</h1>
  <p class="sub">Intermediate Macroeconomics</p>
</header>

<div id="app"></div>

<footer>
  <a href="index.html">All practice quizzes</a> &middot;
  Your progress is saved in this browser, on this device only. Nothing is sent
  anywhere.
</footer>

</div>

<script>
/* ------------------------------------------------------------------ questions
   Order follows the chapter: setup, preferences, budget line, optimum.
   correct = index into options.                                              */
const QUESTIONS = [
 {stem:"In our benchmark model, a rise in TFP <em class='v'>z</em> shifts the labor supply curve to the left. Which channel produces this shift?",
  options:["The wage <em class='v'>w</em> rises, so the consumer has less reason to give up leisure",
           "The lump-sum tax <em class='v'>T</em> rises, so the consumer has less non-labor income and works less",
           "Profit <em class='v'>&pi;</em> rises, so the consumer has more non-labor income and demands more leisure",
           "Hours worked <em class='v'>N</em> rise, so the consumer has less time endowment <em class='v'>h</em> left over"],
  correct:2,
  why:"Higher <em class='v'>z</em> raises equilibrium profit, which the consumer receives as dividends. More non-labor income is an income effect: with leisure a normal good she takes more leisure at every wage, so labor supply shifts left."},

 {stem:"In our benchmark model, a rise in TFP <em class='v'>z</em> shifts labor demand to the right and labor supply to the left. Why did the analysis with three separate graphs fail to settle what happens to equilibrium hours <em class='v'>N</em>*?",
  options:["The two shifts pull hours in opposite directions, and those graphs cannot show how their sizes are connected",
           "The labor demand curve and the labor supply curve are drawn on different axes in those graphs",
           "The consumer's graph and the firm's graph cannot be drawn at one value of the wage",
           "A rise in <em class='v'>z</em> moves only the firm's graph, so the other two graphs say nothing"],
  correct:0,
  why:"Each shift has a clear direction, but the sizes of the two shifts are linked, and the three graphs give no way to draw that link. The one-graph approach puts everything in one picture."},

 {stem:"The goods market clearing condition in our benchmark model says that output <em class='v'>Y</em> is split between two uses. Which?",
  options:["Consumption <em class='v'>C</em> and the capital stock <em class='v'>K</em>",
           "Wages <em class='v'>wN</em> and profit <em class='v'>&pi;</em>",
           "Consumption <em class='v'>C</em> and the lump-sum tax <em class='v'>T</em>",
           "Consumption <em class='v'>C</em> and government spending <em class='v'>G</em>"],
  correct:3,
  why:"<em class='v'>Y</em> = <em class='v'>C</em> + <em class='v'>G</em>. There is no other use of output in the model. Wages and profit are how the revenue from selling <em class='v'>Y</em> is paid out, not uses of it."},

 {stem:"The production possibility frontier (PPF) is drawn in the (&#8467;, <em class='v'>c</em>) axes from the firm's revenue curve <em class='v'>zF</em>(<em class='v'>K</em>, <em class='v'>N</em>). Which sequence of steps turns the revenue curve into the PPF?",
  options:["Take its mirror image, shift it to the left by <em class='v'>h</em>, and raise it up by <em class='v'>G</em>",
           "Take its mirror image, shift it to the right by <em class='v'>h</em>, and drop it down by <em class='v'>G</em>",
           "Keep its orientation, shift it to the right by <em class='v'>h</em>, and drop it down by <em class='v'>G</em>",
           "Take its mirror image, shift it to the right by <em class='v'>h</em>, and raise it up by <em class='v'>G</em>"],
  correct:1,
  why:"Mirror image because &#8467; = <em class='v'>h</em> &minus; <em class='v'>N</em> runs the opposite way from <em class='v'>N</em>; shift right by <em class='v'>h</em> so that no labor sits at &#8467; = <em class='v'>h</em>; drop by <em class='v'>G</em> because the government takes <em class='v'>G</em> of the output."},

 {stem:"The PPF is drawn as <em class='v'>c</em> = <em class='v'>zF</em>(<em class='v'>K</em>, <em class='v'>h</em> &minus; &#8467;) &minus; <em class='v'>G</em>. Holding <em class='v'>z</em> and <em class='v'>K</em> fixed, what happens to the PPF if government spending <em class='v'>G</em> rises?",
  options:["It shifts up by the amount of the rise, at every level of leisure",
           "It gets steeper, with the point where it meets the vertical axis fixed",
           "It shifts down by the amount of the rise, at every level of leisure",
           "It gets steeper, with the point where it meets the horizontal axis fixed"],
  correct:2,
  why:"<em class='v'>G</em> is subtracted from consumption possibilities at every &#8467;, so the whole curve drops by the change in <em class='v'>G</em>. Its slope does not change, because <em class='v'>G</em> does not depend on &#8467;."},

 {stem:"What is the slope of the PPF at a point, in absolute value?",
  options:["The marginal product of labor <em class='v'>MP</em><sub><em class='v'>N</em></sub> at the corresponding hours worked",
           "The marginal rate of substitution <em class='v'>MRS</em> at the corresponding bundle",
           "The marginal product of capital <em class='v'>MP</em><sub><em class='v'>K</em></sub> at the corresponding hours worked",
           "The wage <em class='v'>w</em>, at every point of the PPF"],
  correct:0,
  why:"The PPF is the revenue curve flipped, shifted and dropped, and none of that changes its steepness, so its slope is the slope of the revenue curve, <em class='v'>MP</em><sub><em class='v'>N</em></sub>. It equals <em class='v'>w</em> only at the equilibrium point."},

 {stem:"In the one-graph picture of our benchmark model, the PPF is bowed out (concave). Which feature of the technology makes it so?",
  options:["Complementarity between capital and labor, which makes the revenue curve steeper when <em class='v'>K</em> is higher",
           "More inputs give more output, which makes the revenue curve increasing",
           "Constant returns to scale, which make the revenue curve a straight line",
           "Diminishing returns to labor, which make the revenue curve concave"],
  correct:3,
  why:"The PPF has the shape of the revenue curve. A revenue curve that gets flatter as hours rise (diminishing returns to labor) gives a PPF that gets steeper as leisure falls, which is the bowed-out shape."},

 {stem:"In our benchmark model, the goods market clears in equilibrium. What does this imply for the equilibrium bundle of consumption and leisure?",
  options:["It lies on the PPF, at the point where the wage is highest",
           "It lies on the PPF, but the condition does not say where on it",
           "It lies inside the PPF, with some output left unsold",
           "It lies above the PPF, financed by profit"],
  correct:1,
  why:"The goods market clearing condition <em class='v'>C</em> = <em class='v'>zF</em>(<em class='v'>K</em>, <em class='v'>h</em> &minus; &#8467;) &minus; <em class='v'>G</em> is the equation of the PPF. If it holds, the equilibrium bundle is a point of the PPF. It does not say which point."},

 {stem:"Which two facts about behavior at the equilibrium wage <em class='v'>w</em>* together put the equilibrium at a tangency between an indifference curve and the PPF?",
  options:["The consumer's budget is balanced, and the government's budget is balanced",
           "The firm earns zero profit, and the consumer takes profit as given",
           "The consumer chooses optimally given <em class='v'>w</em>*, and the firm chooses optimally given <em class='v'>w</em>*",
           "The consumer works all her hours, and the firm hires all of them"],
  correct:2,
  why:"Consumer optimality gives <em class='v'>MRS</em> = <em class='v'>w</em>*, firm optimality gives <em class='v'>MP</em><sub><em class='v'>N</em></sub> = <em class='v'>w</em>*. So <em class='v'>MRS</em> = <em class='v'>MP</em><sub><em class='v'>N</em></sub>: the indifference curve and the PPF have the same slope at that point."},

 {stem:"At the equilibrium of the one-graph picture, the indifference curve is tangent to the PPF. What does the slope of their common tangent equal?",
  options:["The equilibrium wage <em class='v'>w</em>*",
           "Equilibrium profit <em class='v'>&pi;</em>*",
           "Government spending <em class='v'>G</em>",
           "The marginal product of capital <em class='v'>MP</em><sub><em class='v'>K</em></sub>"],
  correct:0,
  why:"The slope of the indifference curve is <em class='v'>MRS</em> = <em class='v'>w</em>* and the slope of the PPF is <em class='v'>MP</em><sub><em class='v'>N</em></sub> = <em class='v'>w</em>*, so the common tangent has slope <em class='v'>w</em>*."},

 {stem:"In the one-graph picture of our benchmark model, how can equilibrium output <em class='v'>Y</em>* be read off?",
  options:["As the vertical distance from zero up to the equilibrium level of consumption",
           "As the horizontal distance from the equilibrium leisure to <em class='v'>h</em>",
           "As the vertical distance between the horizontal axis and &minus;<em class='v'>G</em>",
           "As the vertical distance from &minus;<em class='v'>G</em> up to the equilibrium level of consumption"],
  correct:3,
  why:"<em class='v'>Y</em>* = <em class='v'>C</em>* + <em class='v'>G</em>, and <em class='v'>C</em>* is measured from zero, so adding <em class='v'>G</em> means measuring from &minus;<em class='v'>G</em>. The distance between zero and &minus;<em class='v'>G</em> is <em class='v'>G</em> itself, which equals the equilibrium lump-sum tax."},

 {stem:"In the one-graph picture of our benchmark model, with a lump-sum tax that pays for government spending <em class='v'>G</em>, which distance equals the equilibrium tax <em class='v'>T</em>*?",
  options:["The vertical distance between the horizontal axis and the equilibrium consumption",
           "The vertical distance between &minus;<em class='v'>G</em> and the horizontal axis",
           "The horizontal distance between the equilibrium leisure and <em class='v'>h</em>",
           "The vertical distance between &minus;<em class='v'>G</em> and the equilibrium consumption"],
  correct:1,
  why:"The government budget constraint gives <em class='v'>T</em>* = <em class='v'>G</em>, and the PPF is dropped by <em class='v'>G</em>, so the gap between the horizontal axis and &minus;<em class='v'>G</em> is <em class='v'>G</em> = <em class='v'>T</em>*."},

 {stem:"In the one-graph picture of our benchmark model, the firm's decision problem is hidden inside the graph as the mirror image of the usual picture. Where is the origin of the firm's axes?",
  options:["At the point (0, 0), with hours measured to the right",
           "At the point (<em class='v'>h</em>, 0), with hours measured to the left",
           "At the point (<em class='v'>h</em>, &minus;<em class='v'>G</em>), with hours measured to the left",
           "At the point (0, &minus;<em class='v'>G</em>), with hours measured to the right"],
  correct:2,
  why:"With no labor there is no output, and that is the point (<em class='v'>h</em>, &minus;<em class='v'>G</em>) of the PPF. From there hours <em class='v'>N</em> are measured leftward (<em class='v'>N</em> = <em class='v'>h</em> &minus; &#8467;) and output upward."},

 {stem:"In the one-graph picture of our benchmark model, the firm's wage-bill line <em class='v'>w</em>*<em class='v'>N</em> starts at the origin of the firm's axes, and the consumer's budget line passes through the equilibrium point. How are the two lines related?",
  options:["They are parallel, and the budget line is the wage-bill line moved up by profit",
           "They are parallel, and the budget line is the wage-bill line moved down by profit",
           "They coincide, because both have slope <em class='v'>w</em>* and both pass through the equilibrium point",
           "They cross at the equilibrium point, because the budget line is steeper by the factor 1 &minus; <em class='v'>t</em>"],
  correct:0,
  why:"Both lines have slope <em class='v'>w</em>*. The vertical gap between the PPF (the revenue curve) and the wage-bill line at the optimum is profit, and the budget line, which touches the PPF there, sits one profit above the wage-bill line."},

 {stem:"In the one-graph analysis of our benchmark model, TFP <em class='v'>z</em> rises. How does the PPF change?",
  options:["It shifts up in parallel, and the point (<em class='v'>h</em>, &minus;<em class='v'>G</em>) moves up with it",
           "It gets steeper, with the point where it meets the vertical axis fixed",
           "It shifts down and gets flatter, and the point (<em class='v'>h</em>, &minus;<em class='v'>G</em>) stays where it was",
           "It shifts up and gets steeper, and the point (<em class='v'>h</em>, &minus;<em class='v'>G</em>) stays where it was"],
  correct:3,
  why:"<em class='v'>zF</em>(<em class='v'>K</em>, <em class='v'>h</em> &minus; &#8467;) is multiplied by a larger <em class='v'>z</em> at every &#8467; below <em class='v'>h</em>, so the curve is higher and steeper everywhere except where output is zero."},

 {stem:"In the one-graph analysis of a rise in TFP <em class='v'>z</em>, one step moves along the original indifference curve to the bundle where its slope equals the slope at the new equilibrium. Which effect is this step?",
  options:["A pure income effect, because utility does not change and the slope does",
           "A pure substitution effect, because utility does not change and the slope does",
           "A pure substitution effect, because utility changes and the slope does not",
           "A pure income effect, because utility changes and the slope does not"],
  correct:1,
  why:"Staying on one indifference curve means utility is unchanged, so there is no income effect. Only the trade-off, the slope, changes. That is the definition of a pure substitution effect."},

 {stem:"In the one-graph analysis of a rise in TFP <em class='v'>z</em>, the second step moves from the bundle on the original indifference curve to the new equilibrium, at an unchanged slope on a higher indifference curve. If consumption and leisure are normal goods, what happens along this step?",
  options:["Consumption rises and leisure falls, so hours worked rise",
           "Consumption falls and leisure rises, so hours worked fall",
           "Consumption rises and leisure rises, so hours worked fall",
           "Consumption rises and leisure is unchanged, so hours worked are unchanged"],
  correct:2,
  why:"This step is a pure positive income effect, and normal goods are bought more of when income is higher. More leisure means fewer hours worked, which works against the substitution step."},

 {stem:"In the one-graph analysis of a rise in TFP <em class='v'>z</em>, the substitution step raises consumption and the income step, with normal goods, also raises consumption. What follows for equilibrium consumption <em class='v'>C</em>* and output <em class='v'>Y</em>*?",
  options:["Both rise, whichever of the two effects is larger",
           "Both rise only if the substitution effect is larger than the income effect",
           "Consumption rises, but output may fall, because <em class='v'>Y</em>* = <em class='v'>C</em>* + <em class='v'>G</em> and <em class='v'>G</em> is fixed",
           "Both are unchanged, because the two effects cancel in consumption"],
  correct:0,
  why:"Both steps push <em class='v'>C</em>* up, so <em class='v'>C</em>* rises. With <em class='v'>G</em> a fixed parameter, <em class='v'>Y</em>* = <em class='v'>C</em>* + <em class='v'>G</em> rises too. Only the response of hours depends on which effect is larger."},

 {stem:"In the one-graph analysis of a rise in TFP <em class='v'>z</em>, the substitution step lowers leisure and the income step raises it. What do we assume to conclude that equilibrium hours worked <em class='v'>N</em>* rise?",
  options:["That the income effect is larger than the substitution effect",
           "That consumption is a normal good",
           "That government spending <em class='v'>G</em> rises with <em class='v'>z</em>",
           "That the substitution effect is larger than the income effect"],
  correct:3,
  why:"The two steps move leisure in opposite directions, so the graph alone cannot tell the sign of the net change. The course assumes throughout that the substitution effect is larger, which gives lower leisure and higher hours <em class='v'>N</em>*."},

 {stem:"A model is tested by checking whether it predicts the direction of change seen in business cycle data after a rise in TFP <em class='v'>z</em>. In our benchmark model, which set of predictions does the one-graph analysis deliver?",
  options:["Output and consumption rise, but hours worked fall",
           "Output, consumption and hours worked all rise",
           "Output rises, but consumption and hours worked fall",
           "Output and hours worked rise, but consumption falls"],
  correct:1,
  why:"The PPF shifts up, consumption and output rise whichever effect is larger, and hours rise because the substitution effect is larger. That matches the procyclical behavior of all three in the data."}
];

/* ---------------------------------------------------------------- state */
const LETTERS = ["a","b","c","d","e","f"];
const app = document.getElementById("app");

let learned, everWrong, queue, order, seen, firstTry, relearned, wrongHere, answered;

/* Progress is kept in this browser only, under one key. A question counts as
   mastered once it has been answered correctly at the first attempt of a
   showing; missing it puts it back to "shaky" until that happens.            */
const STORE_KEY = "ecn313-equilibrium-one-graph-v1";
let mastered;            // stored: answered right at the first attempt, persisted
let touched;             // stored: has been seen at some point
let sessionResult;       // this session only: qid -> true/false, not yet saved
let savedThisVisit;      // has the student pressed Save during this visit

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.mastered) && o.mastered.length === QUESTIONS.length
         && Array.isArray(o.touched) && o.touched.length === QUESTIONS.length){
        mastered = o.mastered.slice(); touched = o.touched.slice(); return true;
      }
    }
  }catch(e){}
  return false;
}
/* What the stored record would become if the student chooses to save. */
function mergedMastered(){
  return mastered.map((m,i)=> i in sessionResult ? sessionResult[i] : m);
}
function mergedTouched(){
  return touched.map((t,i)=> (i in sessionResult) ? true : t);
}
function saveStore(){
  mastered = mergedMastered();
  touched  = mergedTouched();
  try{
    localStorage.setItem(STORE_KEY,
      JSON.stringify({mastered, touched, saved:Date.now()}));
    return true;
  }catch(e){ return false; }
}
function clearStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  mastered = new Array(QUESTIONS.length).fill(false);
  touched  = new Array(QUESTIONS.length).fill(false);
}
function hasHistory(){ return touched.some(Boolean); }
function notMastered(){ return QUESTIONS.map((_,i)=>i).filter(i=>!mastered[i]); }

function resetAll(){
  learned  = new Array(QUESTIONS.length).fill(false);
  everWrong= new Array(QUESTIONS.length).fill(false);
}

function initStore(){
  if(!loadStore()){
    mastered = new Array(QUESTIONS.length).fill(false);
    touched  = new Array(QUESTIONS.length).fill(false);
  }
}

function startSession(pool){
  queue = pool.slice();
  seen = new Set(); firstTry = new Set(); relearned = new Set();
  sessionResult = {}; savedThisVisit = false;
  nextQuestion();
}

function nextQuestion(){
  if(queue.length === 0){ renderEnd(true); return; }
  wrongHere = 0; answered = false;
  const qid = queue[0];
  order = shuffled(QUESTIONS[qid].options.map((_,i)=>i));
  renderQuestion(qid);
}

function shuffled(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

/* --------------------------------------------------------------- screens */
function renderHome(){
  const done = mastered.filter(Boolean).length;
  const left = notMastered();

  if(hasHistory()){
    app.innerHTML = `
      <div class="card">
        <p class="qmeta">Saved progress found on this device</p>
        <p class="stem">Last time you answered <b>${done}</b> of
          ${QUESTIONS.length} questions correctly at the first attempt.
          What would you like to practise?</p>
        <div class="row">
          ${left.length
            ? `<button class="btn" id="go-left">Only the ${left.length} I have not learned</button>`
            : ``}
          <button class="btn ${left.length ? "ghost" : ""}" id="go-all">All ${QUESTIONS.length} questions</button>
        </div>
        <div class="row">
          <button class="btn quiet" id="forget">Clear saved progress</button>
        </div>
        <p class="note" style="margin-top:.9rem">Progress is kept in this
          browser, on this device only, and never leaves it.</p>
      </div>`;
    document.getElementById("go-all").onclick =
      ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
    const bl = document.getElementById("go-left");
    if(bl) bl.onclick = ()=>{ resetAll(); startSession(left); };
    document.getElementById("forget").onclick =
      ()=>{ clearStore(); resetAll(); renderHome(); };
    return;
  }

  app.innerHTML = `
    <div class="card">
      <p class="stem">Twenty questions on equilibrium on one graph, in the order
        the notes cover them. Get one right first time and it is done. Get it
        wrong and you keep choosing until you find the answer &mdash; then that
        question comes back later in the session.</p>
      <p class="note">At the end you can save your progress on this device, so
        that next time you can practise just the ones you have not learned.</p>
      <div class="row">
        <button class="btn" id="go-all">Start practice session</button>
      </div>
    </div>`;
  document.getElementById("go-all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
}

function renderQuestion(qid){
  const q = QUESTIONS[qid];
  const total = QUESTIONS.length;
  const doneCount = learned.filter(Boolean).length;
  app.innerHTML = `
    <div class="bar"><div style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
    <div class="card">
      <p class="qmeta">Question ${qid+1} of ${total} &middot; ${queue.length} left this round</p>
      <p class="stem">${q.stem}</p>
      <ul class="options" id="opts">
        ${order.map((oi,pos)=>`
          <li><button class="opt" data-oi="${oi}">
            <span class="tag">(${LETTERS[pos]})</span><span>${q.options[oi]}</span>
          </button></li>`).join("")}
      </ul>
      <div id="verdict"></div>
      <div class="row">
        <div id="advance"></div>
        <div class="spacer"></div>
        <button class="btn quiet" id="end">End session</button>
      </div>
    </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>choose(qid, parseInt(b.dataset.oi,10), b);
  });
  document.getElementById("end").onclick = ()=>renderEnd(false);
}

function choose(qid, oi, btn){
  if(answered) return;
  const q = QUESTIONS[qid];
  const firstShowing = !seen.has(qid);
  seen.add(qid);
  touched[qid] = true;
  const verdict = document.getElementById("verdict");

  if(oi !== q.correct){
    everWrong[qid] = true; wrongHere++;
    sessionResult[qid] = false;
    btn.classList.add("wrong"); btn.disabled = true;
    const left = document.querySelectorAll("#opts .opt:not(:disabled)").length;
    verdict.innerHTML = `<div class="verdict no"><b>Not quite.</b>
      ${left > 1 ? "Try again — pick from what is left."
                 : "One option left; it has to be that one."}</div>`;
    return;
  }

  answered = true;
  btn.classList.add("right");
  document.querySelectorAll("#opts .opt").forEach(b=>b.disabled = true);

  let head, tail;
  if(wrongHere === 0){
    queue.shift();
    learned[qid] = true;
    if(everWrong[qid]){ relearned.add(qid); head = "Right — and that one is learned."; }
    else             { firstTry.add(qid);  head = "Correct, first time."; }
    if(firstShowing && !everWrong[qid] && !(qid in sessionResult)){
      sessionResult[qid] = true;
    }
    tail = "It will not come up again.";
  }else{
    queue.shift(); queue.push(qid);
    head = "That's the one.";
    tail = "This question will come back once the others have been through.";
  }
  verdict.innerHTML = `<div class="verdict ok"><b>${head}</b>${q.why}
    <span class="note"><br>${tail}</span></div>`;
  const adv = document.getElementById("advance");
  adv.innerHTML = `<button class="btn" id="next">${queue.length ? "Next question" : "Finish"}</button>`;
  document.getElementById("next").onclick = nextQuestion;
}

function renderEnd(cleared){
  const attempted = seen.size;
  const clean = firstTry.size;
  const fixed = relearned.size;
  const wouldBe = mergedMastered();
  const wouldLeft = wouldBe.map((m,i)=>i).filter(i=>!wouldBe[i]);
  const doneAfter = wouldBe.filter(Boolean).length;
  const anythingToSave = Object.keys(sessionResult).length > 0;

  app.innerHTML = `
    <div class="card">
      <p class="qmeta">${cleared ? "Round complete" : "Session ended"}</p>
      <p class="stem">${cleared
        ? "Everything in this round has been answered."
        : "Here is how the session went."}</p>
      <table class="stats">
        <tr><td>Questions attempted</td><td class="n">${attempted}</td></tr>
        <tr><td>Answered correctly at the first attempt</td><td class="n">${clean}</td></tr>
        <tr><td>Learned after getting it wrong first</td><td class="n">${fixed}</td></tr>
      </table>

      <div id="savebox">
      ${anythingToSave ? `
        <div class="verdict ok" style="margin-top:1rem">
          <b>Save your progress?</b>
          Saving records which questions you answered correctly at the first
          attempt, so that next time you can practise only the rest. It is kept
          <b>in this browser, on this device only</b> &mdash; nothing is sent
          anywhere.
        </div>
        <div class="row">
          <button class="btn" id="save">Save on this device</button>
          <button class="btn quiet" id="nosave">Don't save</button>
        </div>` : ``}
      </div>

      <div class="row" id="nextsteps">
        <button class="btn ghost" id="again">Practise the ${wouldLeft.length} not yet learned</button>
        <button class="btn ghost" id="all">Practise all ${QUESTIONS.length}</button>
        <button class="btn quiet" id="home">Back to start</button>
      </div>
    </div>`;

  const box = document.getElementById("savebox");
  const bs = document.getElementById("save");
  if(bs) bs.onclick = ()=>{
    const ok = saveStore();
    savedThisVisit = true;
    box.innerHTML = ok
      ? `<div class="verdict ok" style="margin-top:1rem"><b>Saved on this device.</b>
         ${doneAfter} of ${QUESTIONS.length} questions are recorded as learned.
         Next time you open this page you can pick up where you left off.</div>`
      : `<div class="verdict no" style="margin-top:1rem"><b>Could not save.</b>
         Your browser is blocking storage — private browsing usually does this.</div>`;
  };
  const bn = document.getElementById("nosave");
  if(bn) bn.onclick = ()=>{
    box.innerHTML = `<p class="note" style="margin-top:1rem">Nothing saved.
      Closing the page will clear this session.</p>`;
  };

  const againBtn = document.getElementById("again");
  if(wouldLeft.length === 0){ againBtn.remove(); }
  else againBtn.onclick = ()=>{ resetAll(); startSession(wouldLeft); };
  document.getElementById("all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
  document.getElementById("home").onclick = renderHome;
}

initStore();
resetAll();
renderHome();
</script>
</body>
</html>
