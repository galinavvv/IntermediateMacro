<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermediate Macroeconomics — Monopolistic firm practice</title>
<style>
  :root{
    --ink:#1A1A1C; --accent:#1F3A6E; --budget:#15607A; --ic:#B21F35;
    --note:#8A6212; --muted:#6B6E76; --rule:#D8DCE3; --paper:#FDFCFA;
    --panel:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",
                Georgia,serif;
    line-height:1.5; padding:1.5rem 1rem 4rem;
  }
  .wrap{max-width:46rem;margin:0 auto}
  header{border-top:3px solid var(--accent);padding-top:.9rem;margin-bottom:1.6rem}
  h1{font-size:1.5rem;margin:0 0 .2rem;color:var(--accent);letter-spacing:.01em}
  .sub{color:var(--muted);font-style:italic;font-size:.95rem;margin:0}
  .card{
    background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:1.2rem 1.3rem;margin-bottom:1.1rem;
  }
  .stem{font-size:1.06rem;margin:0 0 1rem}
  .qmeta{color:var(--muted);font-size:.82rem;letter-spacing:.04em;
         text-transform:uppercase;margin:0 0 .5rem}
  ul.options{list-style:none;margin:0;padding:0}
  ul.options li{margin:0 0 .5rem}
  button.opt{
    width:100%;text-align:left;font:inherit;font-size:1rem;
    background:#fff;border:1px solid var(--rule);border-radius:2px;
    padding:.62rem .8rem;cursor:pointer;color:var(--ink);
    display:flex;gap:.6rem;align-items:baseline;
  }
  button.opt:hover:not(:disabled){border-color:var(--budget);background:#F4F9FB}
  button.opt:disabled{cursor:default}
  button.opt .tag{color:var(--muted);font-variant:small-caps;min-width:1.2rem}
  button.opt.wrong{background:#FBF1F2;border-color:var(--ic);color:#8B4148;
                   text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.right{background:#EFF6F8;border-color:var(--budget);color:var(--budget);
                   font-weight:600}
  .verdict{margin:1rem 0 0;padding:.7rem .85rem;font-size:.97rem;border-left:3px solid}
  .verdict.ok{border-color:var(--budget);background:#EFF6F8}
  .verdict.no{border-color:var(--ic);background:#FBF1F2}
  .verdict b{display:block;margin-bottom:.15rem}
  .btn{
    font:inherit;font-size:1rem;padding:.62rem 1.15rem;border-radius:2px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  }
  .btn:hover{background:#162C55}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:#F2F5FA}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--rule)}
  .btn.quiet:hover{background:#F6F6F4;color:var(--ink)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.1rem}
  .spacer{flex:1}
  .bar{height:4px;background:var(--rule);margin:.3rem 0 1.4rem;overflow:hidden}
  .bar > div{height:100%;background:var(--budget);width:0;transition:width .25s}
  table.stats{border-collapse:collapse;width:100%;margin:.4rem 0 .2rem}
  table.stats td{padding:.42rem .2rem;border-bottom:1px solid var(--rule);font-size:1rem}
  table.stats td.n{text-align:right;font-weight:700;color:var(--accent);width:3.5rem}
  table.stats tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:.9rem}
  em.v{font-style:italic}
  footer{margin-top:2.2rem;color:var(--muted);font-size:.82rem;
         border-top:1px solid var(--rule);padding-top:.7rem}
  footer a{color:var(--muted)} footer a:hover{color:var(--accent)}
  @media (max-width:480px){ body{padding:1rem .7rem 3rem} h1{font-size:1.3rem} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Monopolistic firm — practice</h1>
  <p class="sub">Intermediate Macroeconomics</p>
</header>

<div id="app"></div>

<footer>
  <a href="index.html">All practice quizzes</a> &middot;
  Your progress is saved in this browser, on this device only. Nothing is sent
  anywhere.
</footer>

</div>

<script>
/* ------------------------------------------------------------------ questions
   Order follows the chapter: setup, preferences, budget line, optimum.
   correct = index into options.                                              */
const QUESTIONS = [
 {stem:"In the benchmark model the firm takes the wage <em class='v'>w</em> as given. What does a monopolistic firm do differently?",
  options:["It takes the wage as given, and sets its own output price instead",
           "It takes the wage as given, and sets the hours that consumers must work",
           "It sets the wage, and hires the hours that consumers supply at that wage",
           "It sets the wage, and can hire any number of hours it wants at that wage"],
  correct:2,
  why:"The monopolistic firm chooses the wage, but it can only hire the hours that consumers are willing to supply at that wage."},
 {stem:"A monopolistic firm can set the wage. What stops it from hiring as many hours as it wants at a very low wage?",
  options:["The production function limits the hours that the firm can use productively",
           "The government budget constraint limits the hours that the firm may hire",
           "Consumers will not supply more hours than the labor supply curve says at that wage",
           "The labor demand curve limits the wage that consumers are willing to accept"],
  correct:2,
  why:"The firm cannot force people to work more than they are willing to work, so the hours it hires lie on the labor supply curve <em class='v'>N</em><sup><em class='v'>s</em></sup>(<em class='v'>w</em>)."},
 {stem:"Some firm in the economy sets the wage instead of taking it as given. Why does the Social Planner's problem stay exactly as it was?",
  options:["The planner regulates the monopolistic firm so that it takes the wage as given",
           "The monopolistic firm sets the wage that the planner would have chosen",
           "The planner takes the wage that the monopolistic firm sets as given",
           "Her problem has no markets, wages or monopolists: it only asks what is feasible"],
  correct:3,
  why:"The planner maximizes the consumer's utility on the PPF. Who sets the wage in a market does not appear in her problem."},
 {stem:"In an economy where one monopolistic firm sets the wage, how does the consumer's decision problem compare with the benchmark model, and what condition does the consumer's optimum satisfy?",
  options:["It is unchanged: the consumer takes the wage as given, so MRS = MP<sub><em class='v'>N</em></sub>",
           "It changes: the consumer anticipates the wage, so MRS = MP<sub><em class='v'>N</em></sub>",
           "It is unchanged: the consumer takes the wage as given, so MRS = <em class='v'>w</em>",
           "It changes: the consumer bargains over the wage, so MRS = <em class='v'>w</em> &minus; MP<sub><em class='v'>N</em></sub>"],
  correct:2,
  why:"The consumer still takes the wage as given and chooses where an indifference curve is tangent to the budget line, so MRS = <em class='v'>w</em>. Only the firm's problem is new."},
 {stem:"A monopolistic firm chooses the wage <em class='v'>w</em> and the hours <em class='v'>N</em> to maximize <em class='v'>zF</em>(<em class='v'>K</em>, <em class='v'>N</em>) &minus; <em class='v'>w</em><em class='v'>N</em>, subject to <em class='v'>N</em> = <em class='v'>N</em><sup><em class='v'>s</em></sup>(<em class='v'>w</em>). What does the constraint say?",
  options:["The firm hires exactly the hours that consumers supply at the wage it sets",
           "The firm pays exactly the wage that makes its profit equal to zero",
           "The firm hires exactly the hours at which the marginal product equals the wage",
           "The firm pays exactly the wage that makes consumers supply all of their time"],
  correct:0,
  why:"The labor supply curve comes from the consumer's decision problem. Whatever wage the firm offers, hours worked are the hours supplied at that wage."},
 {stem:"A monopolistic firm maximizes profit subject to <em class='v'>N</em> = <em class='v'>N</em><sup><em class='v'>s</em></sup>(<em class='v'>w</em>). After substituting the constraint into the objective, what does the firm choose?",
  options:["Only the wage, since the hours then follow from the labor supply curve",
           "Neither, since the substitution leaves nothing to maximize",
           "Only the hours, since the wage then follows from the labor demand curve",
           "Both the wage and the hours, each by its own first-order condition"],
  correct:0,
  why:"With the constraint substituted in, profit depends on the wage alone, <em class='v'>zF</em>(<em class='v'>K</em>, <em class='v'>N</em><sup><em class='v'>s</em></sup>(<em class='v'>w</em>)) &minus; <em class='v'>w</em> <em class='v'>N</em><sup><em class='v'>s</em></sup>(<em class='v'>w</em>). Hours follow along the labor supply curve."},
 {stem:"A monopolistic firm's first-order condition can be written MP<sub><em class='v'>N</em></sub> = <em class='v'>w</em> + <em class='v'>N</em><sup><em class='v'>s</em></sup>(<em class='v'>w</em>) &#8725; (&part;<em class='v'>N</em><sup><em class='v'>s</em></sup>(<em class='v'>w</em>)&#8725;&part;<em class='v'>w</em>). Which fact makes the second term positive?",
  options:["Labor demand is downward-sloping, and the wage is positive",
           "Profit is positive, and the firm hires at least some hours",
           "Labor supply is upward-sloping, and hours supplied are positive",
           "The marginal product of labor falls as more hours are hired"],
  correct:2,
  why:"The denominator is positive when labor supply is upward-sloping, and the numerator is the (positive) hours supplied. So the second term is positive."},
 {stem:"A monopolistic firm hires more hours only by offering a higher wage. Why does an extra hour cost it more than the wage <em class='v'>w</em>?",
  options:["The extra hour is taxed, and the tax is added to the wage that the firm pays",
           "The higher wage has to be paid on every hour that the firm hires, not only on the extra one",
           "The extra hour needs more capital, and capital also has to be paid for at a higher price",
           "The extra hour is less productive, so the firm needs to pay it more to keep working"],
  correct:1,
  why:"The firm pays one wage to all its workers. Raising the wage to attract one more hour raises the wage bill on all the hours it already hires."},
 {stem:"A monopolistic firm hires hours until the extra output from one more hour equals the extra cost of that hour. How does the marginal product of labor compare with the wage when it stops?",
  options:["MP<sub><em class='v'>N</em></sub> is above <em class='v'>w</em>, since the extra cost of an hour is above <em class='v'>w</em>",
           "MP<sub><em class='v'>N</em></sub> is below <em class='v'>w</em>, since the extra cost of an hour is below <em class='v'>w</em>",
           "MP<sub><em class='v'>N</em></sub> is above or below <em class='v'>w</em>, depending on the labor supply curve",
           "MP<sub><em class='v'>N</em></sub> equals <em class='v'>w</em>, since the extra cost of an hour equals <em class='v'>w</em>"],
  correct:0,
  why:"The extra cost of an hour is the wage plus the extra wage bill from the higher wage, which is above <em class='v'>w</em>. The firm stops hiring when MP<sub><em class='v'>N</em></sub> has reached that higher cost."},
 {stem:"In an economy where one monopolistic firm sets the wage, the consumer has MRS = <em class='v'>w</em> and the firm has MP<sub><em class='v'>N</em></sub> &gt; <em class='v'>w</em>. What does MRS &lt; MP<sub><em class='v'>N</em></sub> say?",
  options:["An hour of leisure is worth less to the consumer than an hour of labor is in production",
           "An hour of leisure is worth less to the consumer than the wage the firm pays",
           "An hour of leisure is worth as much to the consumer as an hour of labor in production",
           "An hour of leisure is worth more to the consumer than an hour of labor is in production"],
  correct:0,
  why:"MRS is what an hour of leisure is worth to the consumer and MP<sub><em class='v'>N</em></sub> is what an hour of labor is worth in production. With MRS &lt; MP<sub><em class='v'>N</em></sub> one more hour of work would be worth more than it costs the consumer."},
 {stem:"In an economy where one monopolistic firm sets the wage, the goods market clears and the equilibrium has MRS &lt; MP<sub><em class='v'>N</em></sub>. Where is the equilibrium on the graph with leisure on the horizontal axis and consumption on the vertical axis?",
  options:["Below the PPF, on an indifference curve tangent to the budget line",
           "On the PPF, but not at the tangency of an indifference curve and the PPF",
           "On the PPF, at the tangency of an indifference curve and the PPF",
           "Above the PPF, where the consumer has more than the economy produces"],
  correct:1,
  why:"Market clearing puts the equilibrium on the PPF. At the tangency MRS = MP<sub><em class='v'>N</em></sub>, and here MRS &lt; MP<sub><em class='v'>N</em></sub>, so it is not at the tangency."},
 {stem:"In an economy where one monopolistic firm sets the wage, MRS &lt; MP<sub><em class='v'>N</em></sub> at the equilibrium, which is on the PPF. Compared with the Social Planner's choice, where is the equilibrium on the PPF?",
  options:["Where there is more leisure and less consumption than at her choice",
           "Where there is more leisure and more consumption than at her choice",
           "Where there is less leisure and more consumption than at her choice",
           "Where there is less leisure and less consumption than at her choice"],
  correct:0,
  why:"The PPF is steeper than the indifference curve only to the right of the tangency, where leisure is higher. Moving right along the PPF lowers consumption."},
 {stem:"In an economy where one monopolistic firm sets the wage, the equilibrium is on the PPF, with MRS &lt; MP<sub><em class='v'>N</em></sub>. How does the indifference curve through the equilibrium compare with the PPF there?",
  options:["It is flatter than the PPF",
           "It is steeper than the PPF",
           "It is parallel to the PPF",
           "It crosses the PPF from below to above"],
  correct:0,
  why:"The slope of the indifference curve is MRS and the slope of the PPF is MP<sub><em class='v'>N</em></sub> in absolute value. MRS &lt; MP<sub><em class='v'>N</em></sub> means the indifference curve is flatter."},
 {stem:"In an economy with one monopolistic firm, the equilibrium is compared with the Social Planner's choice. Which statement is correct?",
  options:["There is too little employment, but too much consumption and output",
           "There is too little employment, consumption and output",
           "There is too much employment, but too little consumption and output",
           "There is too much employment, consumption and output"],
  correct:1,
  why:"The equilibrium has more leisure than the planner's choice, so fewer hours are worked, and output and consumption fall with them."},
 {stem:"In an economy where one monopolistic firm sets the wage, how does the consumer's utility in the equilibrium compare with what the Social Planner could achieve?",
  options:["It is higher: the firm's profit is paid to the consumer as dividends",
           "It is equal: the equilibrium is on the PPF, just like her choice",
           "It is lower: the equilibrium is on a lower indifference curve than her choice",
           "It is higher: the consumer works fewer hours and enjoys more leisure"],
  correct:2,
  why:"The planner's choice is the best bundle on the PPF. The equilibrium is a different bundle on the PPF, so it must be on a lower indifference curve."},
 {stem:"A proportional labor income tax gives MRS = (1 &minus; <em class='v'>t</em>)<em class='v'>w</em> &lt; <em class='v'>w</em> = MP<sub><em class='v'>N</em></sub>. A monopolistic firm gives MRS = <em class='v'>w</em> &lt; MP<sub><em class='v'>N</em></sub>. What do the two cases have in common?",
  options:["Both put the equilibrium on the PPF, at the planner's choice, with MRS equal to MP<sub><em class='v'>N</em></sub>",
           "Both put the equilibrium on the PPF, to the right of the planner's choice, with MRS below MP<sub><em class='v'>N</em></sub>",
           "Both put the equilibrium below the PPF, to the right of the planner's choice, with MRS below MP<sub><em class='v'>N</em></sub>",
           "Both put the equilibrium on the PPF, to the left of the planner's choice, with MRS below MP<sub><em class='v'>N</em></sub>"],
  correct:1,
  why:"In both cases MRS &lt; MP<sub><em class='v'>N</em></sub>, so the equilibrium is on the PPF but off the tangency, with too little employment. What differs is where the wedge comes from: the consumer's side in one, the firm's in the other."},
 {stem:"A government wants to deal with a monopolistic firm by breaking it up into many competing firms. Why is that not always possible?",
  options:["A lump-sum tax cannot be collected when there are many competing firms",
           "The Social Planner's choice cannot be reached when there are many competing firms",
           "Competing firms would pay a lower wage than the monopolist, so workers would refuse",
           "Competitors may not want to enter the market, for instance when fixed costs are large"],
  correct:3,
  why:"Breaking up a monopoly only helps if other firms enter. If there are large fixed costs, competitors may find it not worth entering."},
 {stem:"A government pays a proportional subsidy to a monopolistic firm's revenue and finances it with a lump-sum tax on consumers. What is the purpose of the subsidy?",
  options:["To raise the consumer's marginal rate of substitution above the wage",
           "To lower the wage that the firm has to pay to the consumers it hires",
           "To encourage the firm to hire and produce more than it would otherwise",
           "To encourage the firm to hire and produce less than it would otherwise"],
  correct:2,
  why:"The monopolistic firm hires too little. A subsidy raises what an extra hour brings the firm, so it hires and produces more."},
 {stem:"The government budget constraint with a subsidy is <em class='v'>G</em> + <em class='v'>s</em> <em class='v'>zF</em>(<em class='v'>K</em>, <em class='v'>N</em>) = <em class='v'>T</em> + &Delta;. What does &Delta; stand for?",
  options:["The new proportional tax that pays for the subsidy payments",
           "The change in the firm's profit that the subsidy causes",
           "The new lump-sum tax that pays for the subsidy payments",
           "The change in government spending that the subsidy causes"],
  correct:2,
  why:"The subsidy payments <em class='v'>s</em> <em class='v'>zF</em>(<em class='v'>K</em>, <em class='v'>N</em>) add to what the government spends, so the lump-sum tax on consumers rises by &Delta; to pay for them."},
 {stem:"On its own, a proportional subsidy to a firm is distortionary. Why can it still be helpful for a monopolistic firm?",
  options:["The firm hires too little, so the subsidy moves the economy toward the planner's choice",
           "The firm hires too much, so the subsidy moves the economy toward the planner's choice",
           "The subsidy is paid by a lump-sum tax, and a lump-sum tax is never distortionary",
           "The subsidy removes the labor supply curve that constrains the monopolistic firm"],
  correct:0,
  why:"A distortion can help when another friction pushes the economy the other way. The firm's market power leads to too little production, and the subsidy pushes toward more."}
];

/* ---------------------------------------------------------------- state */
const LETTERS = ["a","b","c","d","e","f"];
const app = document.getElementById("app");

let learned, everWrong, queue, order, seen, firstTry, relearned, wrongHere, answered;

/* Progress is kept in this browser only, under one key. A question counts as
   mastered once it has been answered correctly at the first attempt of a
   showing; missing it puts it back to "shaky" until that happens.            */
const STORE_KEY = "ecn313-monopolistic-firm-v1";
let mastered;            // stored: answered right at the first attempt, persisted
let touched;             // stored: has been seen at some point
let sessionResult;       // this session only: qid -> true/false, not yet saved
let savedThisVisit;      // has the student pressed Save during this visit

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.mastered) && o.mastered.length === QUESTIONS.length
         && Array.isArray(o.touched) && o.touched.length === QUESTIONS.length){
        mastered = o.mastered.slice(); touched = o.touched.slice(); return true;
      }
    }
  }catch(e){}
  return false;
}
/* What the stored record would become if the student chooses to save. */
function mergedMastered(){
  return mastered.map((m,i)=> i in sessionResult ? sessionResult[i] : m);
}
function mergedTouched(){
  return touched.map((t,i)=> (i in sessionResult) ? true : t);
}
function saveStore(){
  mastered = mergedMastered();
  touched  = mergedTouched();
  try{
    localStorage.setItem(STORE_KEY,
      JSON.stringify({mastered, touched, saved:Date.now()}));
    return true;
  }catch(e){ return false; }
}
function clearStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  mastered = new Array(QUESTIONS.length).fill(false);
  touched  = new Array(QUESTIONS.length).fill(false);
}
function hasHistory(){ return touched.some(Boolean); }
function notMastered(){ return QUESTIONS.map((_,i)=>i).filter(i=>!mastered[i]); }

function resetAll(){
  learned  = new Array(QUESTIONS.length).fill(false);
  everWrong= new Array(QUESTIONS.length).fill(false);
}

function initStore(){
  if(!loadStore()){
    mastered = new Array(QUESTIONS.length).fill(false);
    touched  = new Array(QUESTIONS.length).fill(false);
  }
}

function startSession(pool){
  queue = pool.slice();
  seen = new Set(); firstTry = new Set(); relearned = new Set();
  sessionResult = {}; savedThisVisit = false;
  nextQuestion();
}

function nextQuestion(){
  if(queue.length === 0){ renderEnd(true); return; }
  wrongHere = 0; answered = false;
  const qid = queue[0];
  order = shuffled(QUESTIONS[qid].options.map((_,i)=>i));
  renderQuestion(qid);
}

function shuffled(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

/* --------------------------------------------------------------- screens */
function renderHome(){
  const done = mastered.filter(Boolean).length;
  const left = notMastered();

  if(hasHistory()){
    app.innerHTML = `
      <div class="card">
        <p class="qmeta">Saved progress found on this device</p>
        <p class="stem">Last time you answered <b>${done}</b> of
          ${QUESTIONS.length} questions correctly at the first attempt.
          What would you like to practise?</p>
        <div class="row">
          ${left.length
            ? `<button class="btn" id="go-left">Only the ${left.length} I have not learned</button>`
            : ``}
          <button class="btn ${left.length ? "ghost" : ""}" id="go-all">All ${QUESTIONS.length} questions</button>
        </div>
        <div class="row">
          <button class="btn quiet" id="forget">Clear saved progress</button>
        </div>
        <p class="note" style="margin-top:.9rem">Progress is kept in this
          browser, on this device only, and never leaves it.</p>
      </div>`;
    document.getElementById("go-all").onclick =
      ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
    const bl = document.getElementById("go-left");
    if(bl) bl.onclick = ()=>{ resetAll(); startSession(left); };
    document.getElementById("forget").onclick =
      ()=>{ clearStore(); resetAll(); renderHome(); };
    return;
  }

  app.innerHTML = `
    <div class="card">
      <p class="stem">Twenty questions on the monopolistic firm, in the order
        the notes cover them. Get one right first time and it is done. Get it
        wrong and you keep choosing until you find the answer &mdash; then that
        question comes back later in the session.</p>
      <p class="note">At the end you can save your progress on this device, so
        that next time you can practise just the ones you have not learned.</p>
      <div class="row">
        <button class="btn" id="go-all">Start practice session</button>
      </div>
    </div>`;
  document.getElementById("go-all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
}

function renderQuestion(qid){
  const q = QUESTIONS[qid];
  const total = QUESTIONS.length;
  const doneCount = learned.filter(Boolean).length;
  app.innerHTML = `
    <div class="bar"><div style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
    <div class="card">
      <p class="qmeta">Question ${qid+1} of ${total} &middot; ${queue.length} left this round</p>
      <p class="stem">${q.stem}</p>
      <ul class="options" id="opts">
        ${order.map((oi,pos)=>`
          <li><button class="opt" data-oi="${oi}">
            <span class="tag">(${LETTERS[pos]})</span><span>${q.options[oi]}</span>
          </button></li>`).join("")}
      </ul>
      <div id="verdict"></div>
      <div class="row">
        <div id="advance"></div>
        <div class="spacer"></div>
        <button class="btn quiet" id="end">End session</button>
      </div>
    </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>choose(qid, parseInt(b.dataset.oi,10), b);
  });
  document.getElementById("end").onclick = ()=>renderEnd(false);
}

function choose(qid, oi, btn){
  if(answered) return;
  const q = QUESTIONS[qid];
  const firstShowing = !seen.has(qid);
  seen.add(qid);
  touched[qid] = true;
  const verdict = document.getElementById("verdict");

  if(oi !== q.correct){
    everWrong[qid] = true; wrongHere++;
    sessionResult[qid] = false;
    btn.classList.add("wrong"); btn.disabled = true;
    const left = document.querySelectorAll("#opts .opt:not(:disabled)").length;
    verdict.innerHTML = `<div class="verdict no"><b>Not quite.</b>
      ${left > 1 ? "Try again — pick from what is left."
                 : "One option left; it has to be that one."}</div>`;
    return;
  }

  answered = true;
  btn.classList.add("right");
  document.querySelectorAll("#opts .opt").forEach(b=>b.disabled = true);

  let head, tail;
  if(wrongHere === 0){
    queue.shift();
    learned[qid] = true;
    if(everWrong[qid]){ relearned.add(qid); head = "Right — and that one is learned."; }
    else             { firstTry.add(qid);  head = "Correct, first time."; }
    if(firstShowing && !everWrong[qid] && !(qid in sessionResult)){
      sessionResult[qid] = true;
    }
    tail = "It will not come up again.";
  }else{
    queue.shift(); queue.push(qid);
    head = "That's the one.";
    tail = "This question will come back once the others have been through.";
  }
  verdict.innerHTML = `<div class="verdict ok"><b>${head}</b>${q.why}
    <span class="note"><br>${tail}</span></div>`;
  const adv = document.getElementById("advance");
  adv.innerHTML = `<button class="btn" id="next">${queue.length ? "Next question" : "Finish"}</button>`;
  document.getElementById("next").onclick = nextQuestion;
}

function renderEnd(cleared){
  const attempted = seen.size;
  const clean = firstTry.size;
  const fixed = relearned.size;
  const wouldBe = mergedMastered();
  const wouldLeft = wouldBe.map((m,i)=>i).filter(i=>!wouldBe[i]);
  const doneAfter = wouldBe.filter(Boolean).length;
  const anythingToSave = Object.keys(sessionResult).length > 0;

  app.innerHTML = `
    <div class="card">
      <p class="qmeta">${cleared ? "Round complete" : "Session ended"}</p>
      <p class="stem">${cleared
        ? "Everything in this round has been answered."
        : "Here is how the session went."}</p>
      <table class="stats">
        <tr><td>Questions attempted</td><td class="n">${attempted}</td></tr>
        <tr><td>Answered correctly at the first attempt</td><td class="n">${clean}</td></tr>
        <tr><td>Learned after getting it wrong first</td><td class="n">${fixed}</td></tr>
      </table>

      <div id="savebox">
      ${anythingToSave ? `
        <div class="verdict ok" style="margin-top:1rem">
          <b>Save your progress?</b>
          Saving records which questions you answered correctly at the first
          attempt, so that next time you can practise only the rest. It is kept
          <b>in this browser, on this device only</b> &mdash; nothing is sent
          anywhere.
        </div>
        <div class="row">
          <button class="btn" id="save">Save on this device</button>
          <button class="btn quiet" id="nosave">Don't save</button>
        </div>` : ``}
      </div>

      <div class="row" id="nextsteps">
        <button class="btn ghost" id="again">Practise the ${wouldLeft.length} not yet learned</button>
        <button class="btn ghost" id="all">Practise all ${QUESTIONS.length}</button>
        <button class="btn quiet" id="home">Back to start</button>
      </div>
    </div>`;

  const box = document.getElementById("savebox");
  const bs = document.getElementById("save");
  if(bs) bs.onclick = ()=>{
    const ok = saveStore();
    savedThisVisit = true;
    box.innerHTML = ok
      ? `<div class="verdict ok" style="margin-top:1rem"><b>Saved on this device.</b>
         ${doneAfter} of ${QUESTIONS.length} questions are recorded as learned.
         Next time you open this page you can pick up where you left off.</div>`
      : `<div class="verdict no" style="margin-top:1rem"><b>Could not save.</b>
         Your browser is blocking storage — private browsing usually does this.</div>`;
  };
  const bn = document.getElementById("nosave");
  if(bn) bn.onclick = ()=>{
    box.innerHTML = `<p class="note" style="margin-top:1rem">Nothing saved.
      Closing the page will clear this session.</p>`;
  };

  const againBtn = document.getElementById("again");
  if(wouldLeft.length === 0){ againBtn.remove(); }
  else againBtn.onclick = ()=>{ resetAll(); startSession(wouldLeft); };
  document.getElementById("all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
  document.getElementById("home").onclick = renderHome;
}

initStore();
resetAll();
renderHome();
</script>
</body>
</html>
