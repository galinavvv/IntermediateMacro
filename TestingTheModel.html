<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermediate Macroeconomics — Testing the model practice</title>
<style>
  :root{
    --ink:#1A1A1C; --accent:#1F3A6E; --budget:#15607A; --ic:#B21F35;
    --note:#8A6212; --muted:#6B6E76; --rule:#D8DCE3; --paper:#FDFCFA;
    --panel:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",
                Georgia,serif;
    line-height:1.5; padding:1.5rem 1rem 4rem;
  }
  .wrap{max-width:46rem;margin:0 auto}
  header{border-top:3px solid var(--accent);padding-top:.9rem;margin-bottom:1.6rem}
  h1{font-size:1.5rem;margin:0 0 .2rem;color:var(--accent);letter-spacing:.01em}
  .sub{color:var(--muted);font-style:italic;font-size:.95rem;margin:0}
  .card{
    background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:1.2rem 1.3rem;margin-bottom:1.1rem;
  }
  .stem{font-size:1.06rem;margin:0 0 1rem}
  .qmeta{color:var(--muted);font-size:.82rem;letter-spacing:.04em;
         text-transform:uppercase;margin:0 0 .5rem}
  ul.options{list-style:none;margin:0;padding:0}
  ul.options li{margin:0 0 .5rem}
  button.opt{
    width:100%;text-align:left;font:inherit;font-size:1rem;
    background:#fff;border:1px solid var(--rule);border-radius:2px;
    padding:.62rem .8rem;cursor:pointer;color:var(--ink);
    display:flex;gap:.6rem;align-items:baseline;
  }
  button.opt:hover:not(:disabled){border-color:var(--budget);background:#F4F9FB}
  button.opt:disabled{cursor:default}
  button.opt .tag{color:var(--muted);font-variant:small-caps;min-width:1.2rem}
  button.opt.wrong{background:#FBF1F2;border-color:var(--ic);color:#8B4148;
                   text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.right{background:#EFF6F8;border-color:var(--budget);color:var(--budget);
                   font-weight:600}
  .verdict{margin:1rem 0 0;padding:.7rem .85rem;font-size:.97rem;border-left:3px solid}
  .verdict.ok{border-color:var(--budget);background:#EFF6F8}
  .verdict.no{border-color:var(--ic);background:#FBF1F2}
  .verdict b{display:block;margin-bottom:.15rem}
  .btn{
    font:inherit;font-size:1rem;padding:.62rem 1.15rem;border-radius:2px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  }
  .btn:hover{background:#162C55}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:#F2F5FA}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--rule)}
  .btn.quiet:hover{background:#F6F6F4;color:var(--ink)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.1rem}
  .spacer{flex:1}
  .bar{height:4px;background:var(--rule);margin:.3rem 0 1.4rem;overflow:hidden}
  .bar > div{height:100%;background:var(--budget);width:0;transition:width .25s}
  table.stats{border-collapse:collapse;width:100%;margin:.4rem 0 .2rem}
  table.stats td{padding:.42rem .2rem;border-bottom:1px solid var(--rule);font-size:1rem}
  table.stats td.n{text-align:right;font-weight:700;color:var(--accent);width:3.5rem}
  table.stats tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:.9rem}
  em.v{font-style:italic}
  footer{margin-top:2.2rem;color:var(--muted);font-size:.82rem;
         border-top:1px solid var(--rule);padding-top:.7rem}
  footer a{color:var(--muted)} footer a:hover{color:var(--accent)}
  @media (max-width:480px){ body{padding:1rem .7rem 3rem} h1{font-size:1.3rem} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Testing the model — practice</h1>
  <p class="sub">Intermediate Macroeconomics</p>
</header>

<div id="app"></div>

<footer>
  <a href="index.html">All practice quizzes</a> &middot;
  Your progress is saved in this browser, on this device only. Nothing is sent
  anywhere.
</footer>

</div>

<script>
/* ------------------------------------------------------------------ questions
   Order follows the chapter: setup, preferences, budget line, optimum.
   correct = index into options.                                              */
const QUESTIONS = [
 {stem:"Which feature of consumption in the business cycle data can our one-period model <em>not</em> hope to match?",
  options:["That it is less volatile than GDP",
           "That it is procyclical",
           "That it is coincident with GDP",
           "That it responds to changes in TFP"],
  correct:0,
  why:"Smoothing consumption needs saving and borrowing, which the one-period model does not have. Procyclicality, timing and the response to TFP are all within its reach."},
 {stem:"Why can the model not reproduce the smaller volatility of consumption relative to GDP?",
  options:["Smoothing needs saving and borrowing, which the model lacks",
           "Consumers in the model do not value consumption at all",
           "Government spending absorbs all the output fluctuations",
           "Consumption is not part of output in the model"],
  correct:0,
  why:"Smoothing is a statement about consumption across periods, and a one-period model has no across-periods margin."},
 {stem:"Which feature of employment in the data can a one-period model not match, and why?",
  options:["Its lagging timing, since everything happens at once",
           "Its procyclicality, since wages are fixed in the model",
           "Its smaller volatility, since firms cannot hire",
           "Its positive level, since the time endowment is fixed"],
  correct:0,
  why:"With one period, employment, output and consumption are all determined at the same time, so nothing can lag anything else."},
 {stem:"Which description of employment fits the business cycle facts documented earlier in the course?",
  options:["Procyclical, lagging, and less volatile than GDP",
           "Procyclical, coincident, and less volatile than GDP",
           "Countercyclical, lagging, and less volatile than GDP",
           "Procyclical, lagging, and more volatile than GDP"],
  correct:0,
  why:"Employment moves with the cycle but behind it, and by less than GDP does. Consumption is the one that is coincident."},
 {stem:"In the approach to equilibrium analysis, which question comes first once a parameter has changed?",
  options:["Which agents are directly affected by the change?",
           "What is the total effect on the equilibrium variables?",
           "Are there additional, indirect effects?",
           "Which assumptions does the utility function satisfy?"],
  correct:0,
  why:"We start with who is hit directly, then trace the curve that shifts, then look for indirect effects, and only then add everything up."},
 {stem:"When TFP rises from <em class='v'>z</em><sub>1</sub> to <em class='v'>z</em><sub>2</sub>, which agent is directly affected?",
  options:["Firms, because TFP is a feature of their technology",
           "Consumers, because they buy the output",
           "The government, because it collects the taxes",
           "All agents equally, because TFP is an aggregate"],
  correct:0,
  why:"TFP enters only the production function, so the firm's problem changes first. Consumers are affected later, through profit."},
 {stem:"How does the revenue curve <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>,<em class='v'>N</em>) change when <em class='v'>z</em> rises?",
  options:["It shifts up and becomes steeper",
           "It shifts up but keeps the same slope at every <em class='v'>N</em>",
           "It shifts up and becomes flatter",
           "It shifts down and becomes steeper"],
  correct:0,
  why:"The curve is multiplied by a larger number, so it is higher at every <em class='v'>N</em> and its slope, the marginal product of labor scaled by <em class='v'>z</em>, is larger too."},
 {stem:"If the firm kept its old <em class='v'>N</em> after <em class='v'>z</em> rose, how would the marginal product of labor compare with the wage?",
  options:["MP<sub>N</sub> would exceed <em class='v'>w</em>",
           "MP<sub>N</sub> would be below <em class='v'>w</em>",
           "MP<sub>N</sub> would still equal <em class='v'>w</em>",
           "It depends on the level of <em class='v'>K</em>"],
  correct:0,
  why:"A higher <em class='v'>z</em> raises MP<sub>N</sub> at every <em class='v'>N</em>, so at the old hours it is above the wage and the firm gains by hiring."},
 {stem:"Why must the firm hire <em>more</em> labor to bring MP<sub>N</sub> back down to <em class='v'>w</em>?",
  options:["Because MP<sub>N</sub> is decreasing in <em class='v'>N</em>, so more labor lowers it",
           "Because MP<sub>N</sub> is increasing in <em class='v'>N</em>, so more labor raises it",
           "Because the wage falls as the firm hires",
           "Because a higher <em class='v'>z</em> makes labor cheaper"],
  correct:0,
  why:"Diminishing returns to labor: each extra hour adds less, so hiring is the way to walk MP<sub>N</sub> back down to the wage."},
 {stem:"What happens to the labor demand curve when <em class='v'>z</em> rises?",
  options:["It shifts to the right",
           "It shifts to the left",
           "It does not move; the firm slides along it",
           "It becomes vertical"],
  correct:0,
  why:"At every wage the firm now wants more labor, which is a rightward shift of the whole curve, not a movement along it."},
 {stem:"Suppose labor supply did not respond at all to higher <em class='v'>z</em>. What would happen to the equilibrium wage and employment?",
  options:["The wage and employment would both rise",
           "The wage would rise and employment would fall",
           "The wage would fall and employment would rise",
           "The wage and employment would both fall"],
  correct:0,
  why:"Demand shifts right along an unchanged upward-sloping supply curve, so the wage and employment both go up."},
 {stem:"If labor supply does not shift after <em class='v'>z</em> rises, why does equilibrium output <em class='v'>Y</em>* = <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>,<em class='v'>N</em>*) rise?",
  options:["Because both <em class='v'>z</em> and <em class='v'>N</em>* have risen",
           "Because <em class='v'>z</em> has risen and <em class='v'>N</em>* is unchanged",
           "Because <em class='v'>K</em> has risen",
           "Because the wage has risen"],
  correct:0,
  why:"Output is the revenue curve evaluated at equilibrium hours. The curve is higher and the point on it is further out."},
 {stem:"Given equilibrium output, how do we find equilibrium consumption in the model?",
  options:["<em class='v'>C</em>* = <em class='v'>Y</em>* &minus; <em class='v'>G</em>, from market clearing",
           "<em class='v'>C</em>* = <em class='v'>Y</em>*, since all output is consumed",
           "<em class='v'>C</em>* = <em class='v'>Y</em>* + <em class='v'>G</em>, since the government adds demand",
           "<em class='v'>C</em>* = <em class='v'>w</em>*<em class='v'>N</em>*, since labor income is all spending"],
  correct:0,
  why:"Output is either consumed or spent by the government. With <em class='v'>G</em> fixed, a higher <em class='v'>Y</em>* leaves more for consumption. The consumer's budget constraint also holds, but many of its variables adjust in equilibrium, so it is harder to use."},
 {stem:"What makes the effect of <em class='v'>z</em> on consumers an <em>indirect</em> effect?",
  options:["It comes from a change on the other side of the market",
           "It is smaller in size than the direct effect",
           "It only shows up in a later period",
           "It only affects how much consumers save"],
  correct:0,
  why:"Direct means the agent's own problem changed. Consumers' problem changes here only because firms' profit changed."},
 {stem:"Which equilibrium variable carries the effect of higher <em class='v'>z</em> from firms to consumers?",
  options:["Profit, paid out as dividends",
           "The lump-sum tax paid by consumers",
           "Government spending on defense",
           "The capital stock owned by firms"],
  correct:0,
  why:"Firms are owned by the consumer, so higher profit means higher dividend income."},
 {stem:"When dividends &pi; rise, what happens to the consumer's budget line?",
  options:["It shifts up in parallel",
           "It pivots and becomes steeper",
           "It pivots and becomes flatter",
           "It shifts down in parallel"],
  correct:0,
  why:"Dividends are income that does not depend on hours worked, so they raise the kink and leave the slope, the wage, unchanged."},
 {stem:"Why is the effect of higher dividends on the consumer a pure income effect?",
  options:["Because the wage, and so the slope, does not change",
           "Because the relative price of leisure rises",
           "Because the consumer's preferences change",
           "Because hours worked are held fixed"],
  correct:0,
  why:"A substitution effect needs a change in relative prices, that is, in the slope. A parallel shift has none."},
 {stem:"Which assumption about preferences delivers more leisure when dividends rise?",
  options:["Consumption and leisure are normal goods",
           "More is better than less",
           "Preference for diversity",
           "The substitution effect dominates the income effect"],
  correct:0,
  why:"Normality says that both goods increase with income. The assumption that substitution dominates is about wage changes, not about income."},
 {stem:"As a result of higher profit, which way does the labor supply curve shift?",
  options:["It shifts to the left",
           "It shifts to the right",
           "It does not shift at all",
           "It rotates but does not shift"],
  correct:0,
  why:"More leisure at every wage means fewer hours worked at every wage, which is a leftward shift."},
 {stem:"What is the advantage of solving the model for a general utility function and production function, rather than for specific ones?",
  options:["The results hold for any functions satisfying our assumptions",
           "It lets us skip the first-order conditions entirely",
           "It makes the solution easier to compute numerically",
           "It guarantees the model matches the data exactly"],
  correct:0,
  why:"A specific example shows that the model can behave a certain way. A general solution shows that it must, for every utility and production function that satisfies our assumptions, so the conclusion does not hinge on one parameterization."},
];

/* ---------------------------------------------------------------- state */
const LETTERS = ["a","b","c","d","e","f"];
const app = document.getElementById("app");

let learned, everWrong, queue, order, seen, firstTry, relearned, wrongHere, answered;

/* Progress is kept in this browser only, under one key. A question counts as
   mastered once it has been answered correctly at the first attempt of a
   showing; missing it puts it back to "shaky" until that happens.            */
const STORE_KEY = "ecn313-testing-the-model-v1";
let mastered;            // stored: answered right at the first attempt, persisted
let touched;             // stored: has been seen at some point
let sessionResult;       // this session only: qid -> true/false, not yet saved
let savedThisVisit;      // has the student pressed Save during this visit

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.mastered) && o.mastered.length === QUESTIONS.length
         && Array.isArray(o.touched) && o.touched.length === QUESTIONS.length){
        mastered = o.mastered.slice(); touched = o.touched.slice(); return true;
      }
    }
  }catch(e){}
  return false;
}
/* What the stored record would become if the student chooses to save. */
function mergedMastered(){
  return mastered.map((m,i)=> i in sessionResult ? sessionResult[i] : m);
}
function mergedTouched(){
  return touched.map((t,i)=> (i in sessionResult) ? true : t);
}
function saveStore(){
  mastered = mergedMastered();
  touched  = mergedTouched();
  try{
    localStorage.setItem(STORE_KEY,
      JSON.stringify({mastered, touched, saved:Date.now()}));
    return true;
  }catch(e){ return false; }
}
function clearStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  mastered = new Array(QUESTIONS.length).fill(false);
  touched  = new Array(QUESTIONS.length).fill(false);
}
function hasHistory(){ return touched.some(Boolean); }
function notMastered(){ return QUESTIONS.map((_,i)=>i).filter(i=>!mastered[i]); }

function resetAll(){
  learned  = new Array(QUESTIONS.length).fill(false);
  everWrong= new Array(QUESTIONS.length).fill(false);
}

function initStore(){
  if(!loadStore()){
    mastered = new Array(QUESTIONS.length).fill(false);
    touched  = new Array(QUESTIONS.length).fill(false);
  }
}

function startSession(pool){
  queue = pool.slice();
  seen = new Set(); firstTry = new Set(); relearned = new Set();
  sessionResult = {}; savedThisVisit = false;
  nextQuestion();
}

function nextQuestion(){
  if(queue.length === 0){ renderEnd(true); return; }
  wrongHere = 0; answered = false;
  const qid = queue[0];
  order = shuffled(QUESTIONS[qid].options.map((_,i)=>i));
  renderQuestion(qid);
}

function shuffled(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

/* --------------------------------------------------------------- screens */
function renderHome(){
  const done = mastered.filter(Boolean).length;
  const left = notMastered();

  if(hasHistory()){
    app.innerHTML = `
      <div class="card">
        <p class="qmeta">Saved progress found on this device</p>
        <p class="stem">Last time you answered <b>${done}</b> of
          ${QUESTIONS.length} questions correctly at the first attempt.
          What would you like to practise?</p>
        <div class="row">
          ${left.length
            ? `<button class="btn" id="go-left">Only the ${left.length} I have not learned</button>`
            : ``}
          <button class="btn ${left.length ? "ghost" : ""}" id="go-all">All ${QUESTIONS.length} questions</button>
        </div>
        <div class="row">
          <button class="btn quiet" id="forget">Clear saved progress</button>
        </div>
        <p class="note" style="margin-top:.9rem">Progress is kept in this
          browser, on this device only, and never leaves it.</p>
      </div>`;
    document.getElementById("go-all").onclick =
      ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
    const bl = document.getElementById("go-left");
    if(bl) bl.onclick = ()=>{ resetAll(); startSession(left); };
    document.getElementById("forget").onclick =
      ()=>{ clearStore(); resetAll(); renderHome(); };
    return;
  }

  app.innerHTML = `
    <div class="card">
      <p class="stem">Twenty questions on testing the model, in the order
        the notes cover them. Get one right first time and it is done. Get it
        wrong and you keep choosing until you find the answer &mdash; then that
        question comes back later in the session.</p>
      <p class="note">At the end you can save your progress on this device, so
        that next time you can practise just the ones you have not learned.</p>
      <div class="row">
        <button class="btn" id="go-all">Start practice session</button>
      </div>
    </div>`;
  document.getElementById("go-all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
}

function renderQuestion(qid){
  const q = QUESTIONS[qid];
  const total = QUESTIONS.length;
  const doneCount = learned.filter(Boolean).length;
  app.innerHTML = `
    <div class="bar"><div style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
    <div class="card">
      <p class="qmeta">Question ${qid+1} of ${total} &middot; ${queue.length} left this round</p>
      <p class="stem">${q.stem}</p>
      <ul class="options" id="opts">
        ${order.map((oi,pos)=>`
          <li><button class="opt" data-oi="${oi}">
            <span class="tag">(${LETTERS[pos]})</span><span>${q.options[oi]}</span>
          </button></li>`).join("")}
      </ul>
      <div id="verdict"></div>
      <div class="row">
        <div id="advance"></div>
        <div class="spacer"></div>
        <button class="btn quiet" id="end">End session</button>
      </div>
    </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>choose(qid, parseInt(b.dataset.oi,10), b);
  });
  document.getElementById("end").onclick = ()=>renderEnd(false);
}

function choose(qid, oi, btn){
  if(answered) return;
  const q = QUESTIONS[qid];
  const firstShowing = !seen.has(qid);
  seen.add(qid);
  touched[qid] = true;
  const verdict = document.getElementById("verdict");

  if(oi !== q.correct){
    everWrong[qid] = true; wrongHere++;
    sessionResult[qid] = false;
    btn.classList.add("wrong"); btn.disabled = true;
    const left = document.querySelectorAll("#opts .opt:not(:disabled)").length;
    verdict.innerHTML = `<div class="verdict no"><b>Not quite.</b>
      ${left > 1 ? "Try again — pick from what is left."
                 : "One option left; it has to be that one."}</div>`;
    return;
  }

  answered = true;
  btn.classList.add("right");
  document.querySelectorAll("#opts .opt").forEach(b=>b.disabled = true);

  let head, tail;
  if(wrongHere === 0){
    queue.shift();
    learned[qid] = true;
    if(everWrong[qid]){ relearned.add(qid); head = "Right — and that one is learned."; }
    else             { firstTry.add(qid);  head = "Correct, first time."; }
    if(firstShowing && !everWrong[qid] && !(qid in sessionResult)){
      sessionResult[qid] = true;
    }
    tail = "It will not come up again.";
  }else{
    queue.shift(); queue.push(qid);
    head = "That's the one.";
    tail = "This question will come back once the others have been through.";
  }
  verdict.innerHTML = `<div class="verdict ok"><b>${head}</b>${q.why}
    <span class="note"><br>${tail}</span></div>`;
  const adv = document.getElementById("advance");
  adv.innerHTML = `<button class="btn" id="next">${queue.length ? "Next question" : "Finish"}</button>`;
  document.getElementById("next").onclick = nextQuestion;
}

function renderEnd(cleared){
  const attempted = seen.size;
  const clean = firstTry.size;
  const fixed = relearned.size;
  const wouldBe = mergedMastered();
  const wouldLeft = wouldBe.map((m,i)=>i).filter(i=>!wouldBe[i]);
  const doneAfter = wouldBe.filter(Boolean).length;
  const anythingToSave = Object.keys(sessionResult).length > 0;

  app.innerHTML = `
    <div class="card">
      <p class="qmeta">${cleared ? "Round complete" : "Session ended"}</p>
      <p class="stem">${cleared
        ? "Everything in this round has been answered."
        : "Here is how the session went."}</p>
      <table class="stats">
        <tr><td>Questions attempted</td><td class="n">${attempted}</td></tr>
        <tr><td>Answered correctly at the first attempt</td><td class="n">${clean}</td></tr>
        <tr><td>Learned after getting it wrong first</td><td class="n">${fixed}</td></tr>
      </table>

      <div id="savebox">
      ${anythingToSave ? `
        <div class="verdict ok" style="margin-top:1rem">
          <b>Save your progress?</b>
          Saving records which questions you answered correctly at the first
          attempt, so that next time you can practise only the rest. It is kept
          <b>in this browser, on this device only</b> &mdash; nothing is sent
          anywhere.
        </div>
        <div class="row">
          <button class="btn" id="save">Save on this device</button>
          <button class="btn quiet" id="nosave">Don't save</button>
        </div>` : ``}
      </div>

      <div class="row" id="nextsteps">
        <button class="btn ghost" id="again">Practise the ${wouldLeft.length} not yet learned</button>
        <button class="btn ghost" id="all">Practise all ${QUESTIONS.length}</button>
        <button class="btn quiet" id="home">Back to start</button>
      </div>
    </div>`;

  const box = document.getElementById("savebox");
  const bs = document.getElementById("save");
  if(bs) bs.onclick = ()=>{
    const ok = saveStore();
    savedThisVisit = true;
    box.innerHTML = ok
      ? `<div class="verdict ok" style="margin-top:1rem"><b>Saved on this device.</b>
         ${doneAfter} of ${QUESTIONS.length} questions are recorded as learned.
         Next time you open this page you can pick up where you left off.</div>`
      : `<div class="verdict no" style="margin-top:1rem"><b>Could not save.</b>
         Your browser is blocking storage — private browsing usually does this.</div>`;
  };
  const bn = document.getElementById("nosave");
  if(bn) bn.onclick = ()=>{
    box.innerHTML = `<p class="note" style="margin-top:1rem">Nothing saved.
      Closing the page will clear this session.</p>`;
  };

  const againBtn = document.getElementById("again");
  if(wouldLeft.length === 0){ againBtn.remove(); }
  else againBtn.onclick = ()=>{ resetAll(); startSession(wouldLeft); };
  document.getElementById("all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
  document.getElementById("home").onclick = renderHome;
}

initStore();
resetAll();
renderHome();
</script>
</body>
</html>
