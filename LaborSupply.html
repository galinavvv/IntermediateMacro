<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermediate Macroeconomics — Labor supply practice</title>
<style>
  :root{
    --ink:#1A1A1C; --accent:#1F3A6E; --budget:#15607A; --ic:#B21F35;
    --note:#8A6212; --muted:#6B6E76; --rule:#D8DCE3; --paper:#FDFCFA;
    --panel:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",
                Georgia,serif;
    line-height:1.5; padding:1.5rem 1rem 4rem;
  }
  .wrap{max-width:46rem;margin:0 auto}
  header{border-top:3px solid var(--accent);padding-top:.9rem;margin-bottom:1.6rem}
  h1{font-size:1.5rem;margin:0 0 .2rem;color:var(--accent);letter-spacing:.01em}
  .sub{color:var(--muted);font-style:italic;font-size:.95rem;margin:0}
  .card{
    background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:1.2rem 1.3rem;margin-bottom:1.1rem;
  }
  .stem{font-size:1.06rem;margin:0 0 1rem}
  .qmeta{color:var(--muted);font-size:.82rem;letter-spacing:.04em;
         text-transform:uppercase;margin:0 0 .5rem}
  ul.options{list-style:none;margin:0;padding:0}
  ul.options li{margin:0 0 .5rem}
  button.opt{
    width:100%;text-align:left;font:inherit;font-size:1rem;
    background:#fff;border:1px solid var(--rule);border-radius:2px;
    padding:.62rem .8rem;cursor:pointer;color:var(--ink);
    display:flex;gap:.6rem;align-items:baseline;
  }
  button.opt:hover:not(:disabled){border-color:var(--budget);background:#F4F9FB}
  button.opt:disabled{cursor:default}
  button.opt .tag{color:var(--muted);font-variant:small-caps;min-width:1.2rem}
  button.opt.wrong{background:#FBF1F2;border-color:var(--ic);color:#8B4148;
                   text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.right{background:#EFF6F8;border-color:var(--budget);color:var(--budget);
                   font-weight:600}
  .verdict{margin:1rem 0 0;padding:.7rem .85rem;font-size:.97rem;border-left:3px solid}
  .verdict.ok{border-color:var(--budget);background:#EFF6F8}
  .verdict.no{border-color:var(--ic);background:#FBF1F2}
  .verdict b{display:block;margin-bottom:.15rem}
  .btn{
    font:inherit;font-size:1rem;padding:.62rem 1.15rem;border-radius:2px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  }
  .btn:hover{background:#162C55}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:#F2F5FA}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--rule)}
  .btn.quiet:hover{background:#F6F6F4;color:var(--ink)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.1rem}
  .spacer{flex:1}
  .bar{height:4px;background:var(--rule);margin:.3rem 0 1.4rem;overflow:hidden}
  .bar > div{height:100%;background:var(--budget);width:0;transition:width .25s}
  table.stats{border-collapse:collapse;width:100%;margin:.4rem 0 .2rem}
  table.stats td{padding:.42rem .2rem;border-bottom:1px solid var(--rule);font-size:1rem}
  table.stats td.n{text-align:right;font-weight:700;color:var(--accent);width:3.5rem}
  table.stats tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:.9rem}
  em.v{font-style:italic}
  footer{margin-top:2.2rem;color:var(--muted);font-size:.82rem;
         border-top:1px solid var(--rule);padding-top:.7rem}
  footer a{color:var(--muted)} footer a:hover{color:var(--accent)}
  @media (max-width:480px){ body{padding:1rem .7rem 3rem} h1{font-size:1.3rem} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Labor supply curve — practice</h1>
  <p class="sub">Intermediate Macroeconomics</p>
</header>

<div id="app"></div>

<footer>
  <a href="index.html">All practice quizzes</a> &middot;
  Your progress is saved in this browser, on this device only. Nothing is sent
  anywhere.
</footer>

</div>

<script>
/* ------------------------------------------------------------------ questions
   Order follows the chapter: setup, preferences, budget line, optimum.
   correct = index into options.                                              */
const QUESTIONS = [
 {stem:"To trace out the labor supply curve <em class='v'>N</em><sup>s</sup>(<em class='v'>w</em>), which parameter of the consumer's decision problem do you vary?",
  options:["The wage <em class='v'>w</em>",
           "The lump-sum tax <em class='v'>T</em>",
           "The time endowment <em class='v'>h</em>",
           "Dividends &pi;"],
  correct:0,
  why:"Each wage gives one optimal <em class='v'>N</em>*, and so one point of the curve. Tracing those points out is the curve."},

 {stem:"To understand how the labor supply curve shifts in response to a change in the stock market, what do you change in the consumer's decision problem?",
  options:["The wage <em class='v'>w</em>, holding everything else fixed",
           "Nothing — the consumer's actions do not affect the stock market",
           "The time endowment <em class='v'>h</em>",
           "The value of &pi; &minus; <em class='v'>T</em>, holding <em class='v'>w</em> fixed"],
  correct:3,
  why:"A crash lowers dividends &pi;, which reach the consumer only through &pi; &minus; <em class='v'>T</em>. Holding <em class='v'>w</em> fixed and asking what happens to <em class='v'>N</em>* is exactly what a shift of the curve means. It is true that she cannot affect the stock market — that is why &pi; is a parameter, not a reason we cannot vary it."},

 {stem:"In the consumer's decision problem, a rise in &pi; &minus; <em class='v'>T</em> does what to the budget line?",
  options:["Pivots it about the kink, making it steeper",
           "Shifts it up, parallel to the old one",
           "Makes it flatter, with the kink in place",
           "Leaves it where it is"],
  correct:1,
  why:"The kink (<em class='v'>h</em>, &pi;&minus;<em class='v'>T</em>) rises while the slope &minus;<em class='v'>w</em> is untouched, so every point of the line moves up by the same amount."},

 {stem:"After a rise in &pi; &minus; <em class='v'>T</em>, with <em class='v'>w</em> unchanged, what happens to the optimal choice?",
  options:["<em class='v'>c</em>* rises and &#8467;* falls",
           "<em class='v'>c</em>* and &#8467;* both rise",
           "<em class='v'>c</em>* and &#8467;* both fall",
           "<em class='v'>c</em>* falls and &#8467;* rises"],
  correct:1,
  why:"Both goods are normal (A3), so a pure income gain raises both. Hours worked therefore fall, since <em class='v'>N</em> = <em class='v'>h</em> &minus; &#8467;."},

 {stem:"A diagram shows the budget line shifting up in parallel, and the new optimal bundle having <em>less</em> leisure than the old one. Which assumption does that contradict?",
  options:["A1, more is better than less",
           "A2, preference for diversity",
           "A3, <em class='v'>c</em> and &#8467; are normal goods",
           "None of them — it is possible"],
  correct:2,
  why:"A parallel upward shift is a pure income gain, and normality says a richer consumer takes more of both goods. Less leisure contradicts normality, not A1 or A2."},

 {stem:"After some change in the economic environment, the consumer chooses a bundle on a <em>different indifference curve</em> from before. What does that tell you?",
  options:["There is an income effect, though not necessarily a pure one",
           "There is a substitution effect, though not necessarily a pure one",
           "There is neither effect",
           "She must be worse off than before"],
  correct:0,
  why:"A different curve means her level of utility has changed, and that is what an income effect is."},

 {stem:"After some change in the economic environment, the consumer chooses a bundle at which her indifference curve has a <em>different slope</em> from before. What does that tell you?",
  options:["There is an income effect, though not necessarily a pure one",
           "There is a substitution effect, though not necessarily a pure one",
           "There is neither effect",
           "She must be better off than before"],
  correct:1,
  why:"The slope is the rate at which she is willing to trade the two goods. If it has changed, the trade-off she faces has changed — a substitution effect."},

 {stem:"The consumer moves to a bundle on the <em>same</em> indifference curve as before, at which the slope is <em>different</em>. That move is&hellip;",
  options:["a pure income effect",
           "a pure substitution effect",
           "a combination of the two",
           "impossible"],
  correct:1,
  why:"Same curve means utility is unchanged, so there is no income effect; the changed slope is substitution and nothing else."},

 {stem:"The consumer moves to a bundle on a <em>different</em> indifference curve, at which the slope is the <em>same</em> as before. That move is&hellip;",
  options:["a pure income effect",
           "a pure substitution effect",
           "a combination of the two",
           "impossible"],
  correct:0,
  why:"Utility changed but the trade-off did not, which is exactly a pure income effect."},

 {stem:"In the consumer's decision problem, a rise in the wage <em class='v'>w</em> does what to the budget line?",
  options:["Shifts it up, parallel to the old one",
           "Pivots it about the kink, making it steeper",
           "Shifts it down, parallel to the old one",
           "Moves the kink to the right"],
  correct:1,
  why:"The kink does not involve <em class='v'>w</em> at all, so that point stays put while the rest of the line rotates upward."},

 {stem:"After a rise in the wage, the bundle the consumer chose at the old wage is still affordable. What does that rule out?",
  options:["Any new choice on a lower indifference curve than the old bundle",
           "Any new choice with more leisure than the old bundle",
           "Any new choice with more consumption than the old bundle",
           "Nothing — it rules out no bundles at all"],
  correct:0,
  why:"She could always go back to the old bundle, so she will never settle for something she likes less. That alone removes most of the new budget line."},

 {stem:"To analyze how the optimal choice adjusts to a change in the wage, and to split that adjustment into a pure substitution effect and a pure income effect, we use one additional bundle. That bundle&hellip;",
  options:["lies directly above the original choice",
           "lies on the original indifference curve, at the point where its slope equals the new wage",
           "lies on the new budget line, directly to the left of the original choice",
           "lies on the new indifference curve, at the point where its slope equals the old wage"],
  correct:1,
  why:"Holding utility at its original level while imposing the new trade-off is what isolates the substitution effect on its own. Whatever is left over is then pure income."},

 {stem:"A wage change is split into two pure steps. The step in which the consumer stays on her <em>original</em> indifference curve is&hellip;",
  options:["the income effect",
           "the substitution effect",
           "the total effect",
           "neither — it is just a construction with no name"],
  correct:1,
  why:"Utility is held constant on purpose, so the only thing driving the move is the changed trade-off."},

 {stem:"A wage change is split into two pure steps. The step in which consumption and leisure both move in the <em>same</em> direction is&hellip;",
  options:["the income effect",
           "the substitution effect",
           "the total effect",
           "neither — it is just a construction with no name"],
  correct:0,
  why:"The income step shifts the budget line without tilting it, and both goods are normal (A3), so they rise together or fall together. In the substitution step they must move in <em>opposite</em> directions, since the consumer stays on one indifference curve."},

 {stem:"The wage rises, and the adjustment is decomposed into a pure substitution effect and a pure income effect. In the <em>substitution</em> step, leisure&hellip;",
  options:["rises", "falls", "does not change", "may rise or fall"],
  correct:1,
  why:"Leisure has become more expensive relative to consumption, so along the original indifference curve she moves away from it."},

 {stem:"The wage rises, and the adjustment is decomposed into a pure substitution effect and a pure income effect. In the <em>income</em> step, leisure&hellip;",
  options:["rises", "falls", "does not change", "may rise or fall"],
  correct:0,
  why:"The higher wage makes her richer, and leisure is a normal good (A3). The two steps pull leisure in opposite directions, which is why the total effect is ambiguous."},

 {stem:"The wage rises and the substitution effect turns out to be stronger than the income effect. Then&hellip;",
  options:["&#8467;* rises, <em class='v'>N</em>* falls, and the labor supply curve slopes downward",
           "&#8467;* falls, <em class='v'>N</em>* rises, and the labor supply curve slopes upward",
           "&#8467;* and <em class='v'>N</em>* are both unchanged",
           "consumption falls"],
  correct:1,
  why:"The substitution step pulls leisure down and the income step pulls it up. If the first wins, leisure falls on balance and hours worked rise with the wage."},

 {stem:"Assumption A4 says that&hellip;",
  options:["preferences are such that consumption and leisure are both normal goods",
           "preferences are such that the substitution effect dominates the income effect",
           "the labor market is competitive, so the consumer takes the wage as given",
           "preferences are such that indifference curves are convex"],
  correct:1,
  why:"The model on its own allows both cases. A4 restricts preferences so that Case 1 holds, and it is imposed because the data say that is the relevant case for the average consumer."},

 {stem:"Empirically, at very low wages the labor supply curve is&hellip;",
  options:["upward-sloping", "downward-sloping", "vertical", "horizontal"],
  correct:1,
  why:"Very poor consumers must work <em>more</em> as the wage falls, just to cover basic needs, so hours and the wage move in opposite directions over that range. Over the range where most people are, the curve slopes upward."},

 {stem:"A wage change moves the consumer's bundle to the <em>left</em> of where it was in the (<em class='v'>c</em>, &#8467;) diagram. Where does that same change put her in the labor-market diagram?",
  options:["To the left, at lower <em class='v'>N</em>",
           "To the right, at higher <em class='v'>N</em>",
           "In the same place",
           "It cannot be shown on that diagram"],
  correct:1,
  why:"Left in the consumer diagram means <em>less leisure</em>, and less leisure means more hours worked. The two diagrams mirror each other, which is worth saying out loud whenever you describe a move."}
];

/* ---------------------------------------------------------------- state */
const LETTERS = ["a","b","c","d","e","f"];
const app = document.getElementById("app");

let learned, everWrong, queue, order, seen, firstTry, relearned, wrongHere, answered;

/* Progress is kept in this browser only, under one key. A question counts as
   mastered once it has been answered correctly at the first attempt of a
   showing; missing it puts it back to "shaky" until that happens.            */
const STORE_KEY = "ecn313-labor-supply-v1";
let mastered;            // stored: answered right at the first attempt, persisted
let touched;             // stored: has been seen at some point
let sessionResult;       // this session only: qid -> true/false, not yet saved
let savedThisVisit;      // has the student pressed Save during this visit

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.mastered) && o.mastered.length === QUESTIONS.length
         && Array.isArray(o.touched) && o.touched.length === QUESTIONS.length){
        mastered = o.mastered.slice(); touched = o.touched.slice(); return true;
      }
    }
  }catch(e){}
  return false;
}
/* What the stored record would become if the student chooses to save. */
function mergedMastered(){
  return mastered.map((m,i)=> i in sessionResult ? sessionResult[i] : m);
}
function mergedTouched(){
  return touched.map((t,i)=> (i in sessionResult) ? true : t);
}
function saveStore(){
  mastered = mergedMastered();
  touched  = mergedTouched();
  try{
    localStorage.setItem(STORE_KEY,
      JSON.stringify({mastered, touched, saved:Date.now()}));
    return true;
  }catch(e){ return false; }
}
function clearStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  mastered = new Array(QUESTIONS.length).fill(false);
  touched  = new Array(QUESTIONS.length).fill(false);
}
function hasHistory(){ return touched.some(Boolean); }
function notMastered(){ return QUESTIONS.map((_,i)=>i).filter(i=>!mastered[i]); }

function resetAll(){
  learned  = new Array(QUESTIONS.length).fill(false);
  everWrong= new Array(QUESTIONS.length).fill(false);
}

function initStore(){
  if(!loadStore()){
    mastered = new Array(QUESTIONS.length).fill(false);
    touched  = new Array(QUESTIONS.length).fill(false);
  }
}

function startSession(pool){
  queue = pool.slice();
  seen = new Set(); firstTry = new Set(); relearned = new Set();
  sessionResult = {}; savedThisVisit = false;
  nextQuestion();
}

function nextQuestion(){
  if(queue.length === 0){ renderEnd(true); return; }
  wrongHere = 0; answered = false;
  const qid = queue[0];
  order = shuffled(QUESTIONS[qid].options.map((_,i)=>i));
  renderQuestion(qid);
}

function shuffled(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

/* --------------------------------------------------------------- screens */
function renderHome(){
  const done = mastered.filter(Boolean).length;
  const left = notMastered();

  if(hasHistory()){
    app.innerHTML = `
      <div class="card">
        <p class="qmeta">Saved progress found on this device</p>
        <p class="stem">Last time you answered <b>${done}</b> of
          ${QUESTIONS.length} questions correctly at the first attempt.
          What would you like to practise?</p>
        <div class="row">
          ${left.length
            ? `<button class="btn" id="go-left">Only the ${left.length} I have not learned</button>`
            : ``}
          <button class="btn ${left.length ? "ghost" : ""}" id="go-all">All ${QUESTIONS.length} questions</button>
        </div>
        <div class="row">
          <button class="btn quiet" id="forget">Clear saved progress</button>
        </div>
        <p class="note" style="margin-top:.9rem">Progress is kept in this
          browser, on this device only, and never leaves it.</p>
      </div>`;
    document.getElementById("go-all").onclick =
      ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
    const bl = document.getElementById("go-left");
    if(bl) bl.onclick = ()=>{ resetAll(); startSession(left); };
    document.getElementById("forget").onclick =
      ()=>{ clearStore(); resetAll(); renderHome(); };
    return;
  }

  app.innerHTML = `
    <div class="card">
      <p class="stem">Twenty questions on the consumer's responses and the labor supply curve, in the order
        the notes cover them. Get one right first time and it is done. Get it
        wrong and you keep choosing until you find the answer &mdash; then that
        question comes back later in the session.</p>
      <p class="note">At the end you can save your progress on this device, so
        that next time you can practise just the ones you have not learned.</p>
      <div class="row">
        <button class="btn" id="go-all">Start practice session</button>
      </div>
    </div>`;
  document.getElementById("go-all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
}

function renderQuestion(qid){
  const q = QUESTIONS[qid];
  const total = QUESTIONS.length;
  const doneCount = learned.filter(Boolean).length;
  app.innerHTML = `
    <div class="bar"><div style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
    <div class="card">
      <p class="qmeta">Question ${qid+1} of ${total} &middot; ${queue.length} left this round</p>
      <p class="stem">${q.stem}</p>
      <ul class="options" id="opts">
        ${order.map((oi,pos)=>`
          <li><button class="opt" data-oi="${oi}">
            <span class="tag">(${LETTERS[pos]})</span><span>${q.options[oi]}</span>
          </button></li>`).join("")}
      </ul>
      <div id="verdict"></div>
      <div class="row">
        <div id="advance"></div>
        <div class="spacer"></div>
        <button class="btn quiet" id="end">End session</button>
      </div>
    </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>choose(qid, parseInt(b.dataset.oi,10), b);
  });
  document.getElementById("end").onclick = ()=>renderEnd(false);
}

function choose(qid, oi, btn){
  if(answered) return;
  const q = QUESTIONS[qid];
  const firstShowing = !seen.has(qid);
  seen.add(qid);
  touched[qid] = true;
  const verdict = document.getElementById("verdict");

  if(oi !== q.correct){
    everWrong[qid] = true; wrongHere++;
    sessionResult[qid] = false;
    btn.classList.add("wrong"); btn.disabled = true;
    const left = document.querySelectorAll("#opts .opt:not(:disabled)").length;
    verdict.innerHTML = `<div class="verdict no"><b>Not quite.</b>
      ${left > 1 ? "Try again — pick from what is left."
                 : "One option left; it has to be that one."}</div>`;
    return;
  }

  answered = true;
  btn.classList.add("right");
  document.querySelectorAll("#opts .opt").forEach(b=>b.disabled = true);

  let head, tail;
  if(wrongHere === 0){
    queue.shift();
    learned[qid] = true;
    if(everWrong[qid]){ relearned.add(qid); head = "Right — and that one is learned."; }
    else             { firstTry.add(qid);  head = "Correct, first time."; }
    if(firstShowing && !everWrong[qid] && !(qid in sessionResult)){
      sessionResult[qid] = true;
    }
    tail = "It will not come up again.";
  }else{
    queue.shift(); queue.push(qid);
    head = "That's the one.";
    tail = "This question will come back once the others have been through.";
  }
  verdict.innerHTML = `<div class="verdict ok"><b>${head}</b>${q.why}
    <span class="note"><br>${tail}</span></div>`;
  const adv = document.getElementById("advance");
  adv.innerHTML = `<button class="btn" id="next">${queue.length ? "Next question" : "Finish"}</button>`;
  document.getElementById("next").onclick = nextQuestion;
}

function renderEnd(cleared){
  const attempted = seen.size;
  const clean = firstTry.size;
  const fixed = relearned.size;
  const wouldBe = mergedMastered();
  const wouldLeft = wouldBe.map((m,i)=>i).filter(i=>!wouldBe[i]);
  const doneAfter = wouldBe.filter(Boolean).length;
  const anythingToSave = Object.keys(sessionResult).length > 0;

  app.innerHTML = `
    <div class="card">
      <p class="qmeta">${cleared ? "Round complete" : "Session ended"}</p>
      <p class="stem">${cleared
        ? "Everything in this round has been answered."
        : "Here is how the session went."}</p>
      <table class="stats">
        <tr><td>Questions attempted</td><td class="n">${attempted}</td></tr>
        <tr><td>Answered correctly at the first attempt</td><td class="n">${clean}</td></tr>
        <tr><td>Learned after getting it wrong first</td><td class="n">${fixed}</td></tr>
      </table>

      <div id="savebox">
      ${anythingToSave ? `
        <div class="verdict ok" style="margin-top:1rem">
          <b>Save your progress?</b>
          Saving records which questions you answered correctly at the first
          attempt, so that next time you can practise only the rest. It is kept
          <b>in this browser, on this device only</b> &mdash; nothing is sent
          anywhere.
        </div>
        <div class="row">
          <button class="btn" id="save">Save on this device</button>
          <button class="btn quiet" id="nosave">Don't save</button>
        </div>` : ``}
      </div>

      <div class="row" id="nextsteps">
        <button class="btn ghost" id="again">Practise the ${wouldLeft.length} not yet learned</button>
        <button class="btn ghost" id="all">Practise all ${QUESTIONS.length}</button>
        <button class="btn quiet" id="home">Back to start</button>
      </div>
    </div>`;

  const box = document.getElementById("savebox");
  const bs = document.getElementById("save");
  if(bs) bs.onclick = ()=>{
    const ok = saveStore();
    savedThisVisit = true;
    box.innerHTML = ok
      ? `<div class="verdict ok" style="margin-top:1rem"><b>Saved on this device.</b>
         ${doneAfter} of ${QUESTIONS.length} questions are recorded as learned.
         Next time you open this page you can pick up where you left off.</div>`
      : `<div class="verdict no" style="margin-top:1rem"><b>Could not save.</b>
         Your browser is blocking storage — private browsing usually does this.</div>`;
  };
  const bn = document.getElementById("nosave");
  if(bn) bn.onclick = ()=>{
    box.innerHTML = `<p class="note" style="margin-top:1rem">Nothing saved.
      Closing the page will clear this session.</p>`;
  };

  const againBtn = document.getElementById("again");
  if(wouldLeft.length === 0){ againBtn.remove(); }
  else againBtn.onclick = ()=>{ resetAll(); startSession(wouldLeft); };
  document.getElementById("all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
  document.getElementById("home").onclick = renderHome;
}

initStore();
resetAll();
renderHome();
</script>
</body>
</html>
