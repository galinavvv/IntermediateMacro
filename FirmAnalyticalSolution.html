<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermediate Macroeconomics — Firm analytical solution practice</title>
<style>
  :root{
    --ink:#1A1A1C; --accent:#1F3A6E; --budget:#15607A; --ic:#B21F35;
    --note:#8A6212; --muted:#6B6E76; --rule:#D8DCE3; --paper:#FDFCFA;
    --panel:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",
                Georgia,serif;
    line-height:1.5; padding:1.5rem 1rem 4rem;
  }
  .wrap{max-width:46rem;margin:0 auto}
  header{border-top:3px solid var(--accent);padding-top:.9rem;margin-bottom:1.6rem}
  h1{font-size:1.5rem;margin:0 0 .2rem;color:var(--accent);letter-spacing:.01em}
  .sub{color:var(--muted);font-style:italic;font-size:.95rem;margin:0}
  .card{
    background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:1.2rem 1.3rem;margin-bottom:1.1rem;
  }
  .stem{font-size:1.06rem;margin:0 0 1rem}
  .qmeta{color:var(--muted);font-size:.82rem;letter-spacing:.04em;
         text-transform:uppercase;margin:0 0 .5rem}
  ul.options{list-style:none;margin:0;padding:0}
  ul.options li{margin:0 0 .5rem}
  button.opt{
    width:100%;text-align:left;font:inherit;font-size:1rem;
    background:#fff;border:1px solid var(--rule);border-radius:2px;
    padding:.62rem .8rem;cursor:pointer;color:var(--ink);
    display:flex;gap:.6rem;align-items:baseline;
  }
  button.opt:hover:not(:disabled){border-color:var(--budget);background:#F4F9FB}
  button.opt:disabled{cursor:default}
  button.opt .tag{color:var(--muted);font-variant:small-caps;min-width:1.2rem}
  button.opt.wrong{background:#FBF1F2;border-color:var(--ic);color:#8B4148;
                   text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.right{background:#EFF6F8;border-color:var(--budget);color:var(--budget);
                   font-weight:600}
  .verdict{margin:1rem 0 0;padding:.7rem .85rem;font-size:.97rem;border-left:3px solid}
  .verdict.ok{border-color:var(--budget);background:#EFF6F8}
  .verdict.no{border-color:var(--ic);background:#FBF1F2}
  .verdict b{display:block;margin-bottom:.15rem}
  .btn{
    font:inherit;font-size:1rem;padding:.62rem 1.15rem;border-radius:2px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  }
  .btn:hover{background:#162C55}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:#F2F5FA}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--rule)}
  .btn.quiet:hover{background:#F6F6F4;color:var(--ink)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.1rem}
  .spacer{flex:1}
  .bar{height:4px;background:var(--rule);margin:.3rem 0 1.4rem;overflow:hidden}
  .bar > div{height:100%;background:var(--budget);width:0;transition:width .25s}
  table.stats{border-collapse:collapse;width:100%;margin:.4rem 0 .2rem}
  table.stats td{padding:.42rem .2rem;border-bottom:1px solid var(--rule);font-size:1rem}
  table.stats td.n{text-align:right;font-weight:700;color:var(--accent);width:3.5rem}
  table.stats tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:.9rem}
  em.v{font-style:italic}
  footer{margin-top:2.2rem;color:var(--muted);font-size:.82rem;
         border-top:1px solid var(--rule);padding-top:.7rem}
  footer a{color:var(--muted)} footer a:hover{color:var(--accent)}
  @media (max-width:480px){ body{padding:1rem .7rem 3rem} h1{font-size:1.3rem} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Analytical solution of the firm's problem — practice</h1>
  <p class="sub">Intermediate Macroeconomics</p>
</header>

<div id="app"></div>

<footer>
  <a href="index.html">All practice quizzes</a> &middot;
  Your progress is saved in this browser, on this device only. Nothing is sent
  anywhere.
</footer>

</div>

<script>
/* ------------------------------------------------------------------ questions
   Order follows the chapter: the six assumptions, the examples, the general
   power function, solving the firm's problem, calibration.
   correct = index into options.                                              */
const QUESTIONS = [

/* --- the six assumptions ------------------------------------------------ */

{stem:"Which assumption on the technology says that <em class='v'>MP</em><sub><em class='v'>N</em></sub> decreases as <em class='v'>N</em> rises?",
 options:["A1, more inputs give more output",
          "A2, diminishing returns to labor",
          "A3, complementarity between capital and labor",
          "A6, constant returns to scale"],
 correct:1,
 why:"A2 is about what one extra hour adds: each hour hired raises output by less than the hour before it."},

{stem:"Which assumption on the technology says that <em class='v'>MP</em><sub><em class='v'>N</em></sub> rises when the firm has more capital?",
 options:["A2, diminishing returns to labor",
          "A3, complementarity between capital and labor",
          "A5, <em class='v'>MP</em><sub><em class='v'>K</em></sub> rises when <em class='v'>N</em> rises",
          "A6, constant returns to scale"],
 correct:1,
 why:"Complementarity says capital makes labor more productive: with more machines an extra hour of work adds more output. A5 is the mirror statement, about the marginal product of capital."},

{stem:"A technology satisfies <em class='v'>F</em>(<em class='v'>xK</em>, <em class='v'>xN</em>) = <em class='v'>x</em> <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) for every <em class='v'>x</em> &gt; 0. What does that say?",
 options:["Doubling both capital and labor doubles output",
          "Doubling labor on its own doubles output",
          "The marginal product of labor stays constant as <em class='v'>N</em> rises",
          "Output per hour worked rises as the firm grows"],
 correct:0,
 why:"Constant returns to scale is about scaling both inputs together: multiply capital and labor by <em class='v'>x</em> and output is multiplied by <em class='v'>x</em> as well."},

/* --- the four examples from class --------------------------------------- */

{stem:"For <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) = <em class='v'>K</em> &minus; <em class='v'>N</em>, which statements are correct?",
 options:["A1, more inputs give more output, is violated",
          "only A2, diminishing returns to labor, is violated",
          "only A3, complementarity between capital and labor, is violated",
          "A6, constant returns to scale, is violated"],
 correct:0,
 why:"An extra hour of labor lowers output here, so labor fails to raise output at all and the first assumption is already lost."},

{stem:"In class, <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) = <em class='v'>K</em> + <em class='v'>N</em> was rejected because <em class='v'>MP</em><sub><em class='v'>N</em></sub> = <em class='v'>z</em> whatever <em class='v'>N</em> is. Which assumption does that fact contradict?",
 options:["A1, more inputs give more output",
          "A2, diminishing returns to labor",
          "A4, diminishing returns to capital",
          "A6, constant returns to scale"],
 correct:1,
 why:"A marginal product that never falls is exactly what diminishing returns rules out: here the hundredth hour adds as much as the first."},

{stem:"For <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) = &radic;<em class='v'>K</em> + &radic;<em class='v'>N</em>, the marginal product of labor is <em class='v'>z</em>&#8725;(2&radic;<em class='v'>N</em>): it falls as <em class='v'>N</em> rises, and no <em class='v'>K</em> appears in it. Which assumption does the absence of <em class='v'>K</em> contradict?",
 options:["A1, more inputs give more output",
          "A2, diminishing returns to labor",
          "A3, complementarity between capital and labor",
          "A4, diminishing returns to capital"],
 correct:2,
 why:"Complementarity requires extra capital to raise the marginal product of labor. Here extra machines leave the value of an additional hour untouched."},

{stem:"What is true of <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) = &radic;<em class='v'>K</em> &middot; &radic;<em class='v'>N</em>?",
 options:["It satisfies all six assumptions on the technology",
          "It fails A2, because the marginal product of labor does not decline",
          "It fails A3, because the marginal product of labor does not involve <em class='v'>K</em>",
          "It fails A6, because doubling both inputs more than doubles output"],
 correct:0,
 why:"It is the Cobb&ndash;Douglas case with &alpha; = &#189;. Each marginal product declines in its own input and rises in the other, and scaling both inputs scales output in proportion."},

/* --- the general power function ----------------------------------------- */

{stem:"For <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) = <em class='v'>K</em><sup>&alpha;</sup><em class='v'>N</em><sup>&beta;</sup>, the marginal product of labor is <em class='v'>z</em>&beta;<em class='v'>K</em><sup>&alpha;</sup><em class='v'>N</em><sup>&beta;&minus;1</sup>. Which condition makes it fall as <em class='v'>N</em> rises?",
 options:["&beta; &lt; 1",
          "&beta; &gt; 1",
          "&alpha; &lt; 1",
          "&alpha; + &beta; = 1"],
 correct:0,
 why:"The exponent on <em class='v'>N</em> is &beta; &minus; 1, which is negative only when &beta; sits below 1, and a negative exponent is what makes the marginal product decline."},

{stem:"For <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) = <em class='v'>K</em><sup>&alpha;</sup><em class='v'>N</em><sup>&beta;</sup>, the marginal product of capital is <em class='v'>z</em>&alpha;<em class='v'>K</em><sup>&alpha;&minus;1</sup><em class='v'>N</em><sup>&beta;</sup>. Which condition makes it fall as <em class='v'>K</em> rises?",
 options:["&alpha; &lt; 1",
          "&alpha; &gt; 1",
          "&beta; &lt; 1",
          "&alpha; + &beta; = 1"],
 correct:0,
 why:"The exponent on <em class='v'>K</em> is &alpha; &minus; 1, which is negative only when &alpha; sits below 1. The size of &beta; settles what happens to labor, not to capital."},

{stem:"For <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) = <em class='v'>K</em><sup>&alpha;</sup><em class='v'>N</em><sup>&beta;</sup>, which condition gives constant returns to scale?",
 options:["&alpha; + &beta; = 1",
          "&alpha; = &beta;",
          "&alpha; &lt; 1 and &beta; &lt; 1",
          "&alpha; + &beta; &lt; 1"],
 correct:0,
 why:"Scaling both inputs by <em class='v'>x</em> multiplies output by <em class='v'>x</em><sup>&alpha;+&beta;</sup>, which equals <em class='v'>x</em> for every <em class='v'>x</em> only when the two exponents add to one."},

{stem:"The Cobb&ndash;Douglas technology is <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) = <em class='v'>K</em><sup>&alpha;</sup><em class='v'>N</em><sup>1&minus;&alpha;</sup>. What does the restriction 0 &lt; &alpha; &lt; 1 ensure?",
 options:["Each marginal product is positive and declines in its own input",
          "Labor's exponent is larger than capital's exponent",
          "Output rises more than in proportion when both inputs double",
          "Capital and labor are not complements"],
 correct:0,
 why:"With both exponents strictly between zero and one, each input raises output and each marginal product declines in its own input. Constant returns come separately, from the exponents adding to one."},

/* --- solving the firm's problem ----------------------------------------- */

{stem:"A firm hires labor on a competitive market at the wage <em class='v'>w</em>, with capital given. At the hours it chooses, which condition holds?",
 options:["<em class='v'>MP</em><sub><em class='v'>N</em></sub> = <em class='v'>w</em>",
          "<em class='v'>MP</em><sub><em class='v'>N</em></sub> = 0",
          "<em class='v'>MP</em><sub><em class='v'>K</em></sub> = <em class='v'>w</em>",
          "Revenue is equal to the wage bill"],
 correct:0,
 why:"The firm keeps hiring while an extra hour adds more to revenue than it costs, so at the optimum the marginal product of labor has fallen to the wage. Revenue above the wage bill is profit, not an optimality condition."},

{stem:"Labor demand with the Cobb&ndash;Douglas technology is <em class='v'>N</em><sup>d</sup>(<em class='v'>w</em>) = (<em class='v'>z</em>(1 &minus; &alpha;)&#8725;<em class='v'>w</em>)<sup>1&#8725;&alpha;</sup><em class='v'>K</em>. What does the formula say happens when the wage rises, with <em class='v'>z</em>, &alpha; and <em class='v'>K</em> held fixed?",
 options:["Optimal hours fall, along a downward-sloping curve",
          "Optimal hours rise, along an upward-sloping curve",
          "Optimal hours hold still, because capital did not change",
          "The whole curve shifts to the right"],
 correct:0,
 why:"The wage sits in the denominator and the exponent 1&#8725;&alpha; is positive, so a higher wage means fewer hours. Nothing else moved, so the firm travels along the curve it already had."},

{stem:"Labor demand with the Cobb&ndash;Douglas technology is <em class='v'>N</em><sup>d</sup>(<em class='v'>w</em>) = (<em class='v'>z</em>(1 &minus; &alpha;)&#8725;<em class='v'>w</em>)<sup>1&#8725;&alpha;</sup><em class='v'>K</em>. What does the formula say happens when <em class='v'>z</em> rises, with <em class='v'>w</em>, &alpha; and <em class='v'>K</em> held fixed?",
 options:["At every wage the firm wants more hours, so the curve shifts to the right",
          "At every wage the firm wants fewer hours, so the curve shifts to the left",
          "The firm slides down the curve it already had",
          "Optimal hours hold still, because the wage did not move"],
 correct:0,
 why:"Productivity multiplies optimal hours at every wage, so the whole curve moves rather than the firm sliding along a curve that stays put."},

{stem:"In <em class='v'>N</em><sup>d</sup>(<em class='v'>w</em>) = (<em class='v'>z</em>(1 &minus; &alpha;)&#8725;<em class='v'>w</em>)<sup>1&#8725;&alpha;</sup><em class='v'>K</em>, capital multiplies the whole expression. What does that say?",
 options:["At any given wage, a firm with more capital hires more hours",
          "At any given wage, a firm with more capital hires fewer hours, since capital replaces labor",
          "Capital alters the steepness of the curve but not its position",
          "Capital matters only when the wage happens to be high"],
 correct:0,
 why:"Capital enters as a multiplier, so more of it raises optimal hours proportionally at every wage. This is complementarity showing up in the formula."},

{stem:"The graphical argument of the previous class already showed that labor demand is downward-sloping and shifts right when productivity rises. What does having a formula add?",
 options:["It says by how much hours change, not only in which direction",
          "It shows that the curve is downward-sloping, which graphs could not show",
          "It removes the need to assume diminishing returns to labor",
          "It makes the conclusions hold for every technology"],
 correct:0,
 why:"Graphs give directions; a formula gives magnitudes, which is what quantitative predictions need. The directions were already available, and a formula applies only to the technology it was derived from."},

/* --- calibration --------------------------------------------------------- */

{stem:"The technology <em class='v'>Y</em> = <em class='v'>z</em><em class='v'>K</em><sup>&alpha;</sup><em class='v'>N</em><sup>1&minus;&alpha;</sup> has two parameters that are not observed. Why is requiring labor demand to pass through one observed wage-and-hours pair not enough to pin them down?",
 options:["One equation cannot settle two unknowns: many pairs of <em class='v'>z</em> and &alpha; give curves through that point",
          "The observed pair may fail to lie on any labor demand curve at all",
          "Capital is not observed, so the curve cannot be drawn",
          "The wage is set by the market, so it carries no information about the firm"],
 correct:0,
 why:"Two unknowns need two equations. Many different pairs produce a curve through one point, and they differ in how much output they imply at that point."},

{stem:"In the calibration of the firm's technology, which second observation is used so that both <em class='v'>z</em> and &alpha; can be pinned down?",
 options:["The output produced at the observed capital and hours",
          "The profit earned at the observed wage",
          "The price at which capital can be bought",
          "The number of hours a worker is able to supply"],
 correct:0,
 why:"Output is in the data too, so requiring the model to produce the observed GDP at the observed inputs supplies the second equation."},

{stem:"Calibrating the firm's technology gives 1 &minus; &alpha; = the wage multiplied by hours worked, divided by output. What is the quantity on the right called, and what does it measure?",
 options:["The labor share: the part of revenue the firm spends on labor",
          "The capital share: the part of revenue paid to the owners of capital",
          "The markup: how far the wage sits above the marginal product of labor",
          "Productivity: how much output one hour of work produces"],
 correct:0,
 why:"Wages paid divided by revenue is the part of revenue going to labor, and with a Cobb&ndash;Douglas technology and no taxes it comes out equal to the exponent on <em class='v'>N</em>."},

{stem:"Calibrating the firm's technology obtains &alpha; from the relation 1 &minus; &alpha; = the wage multiplied by hours worked, divided by output. Which observed number plays no part in that step?",
 options:["The capital stock",
          "The hours worked",
          "The hourly wage",
          "The output produced"],
 correct:0,
 why:"Only wages, hours and output appear in that relation. Capital is needed at the next step, the equation that delivers <em class='v'>z</em>."}

];

/* ---------------------------------------------------------------- state */
const LETTERS = ["a","b","c","d","e","f"];
const app = document.getElementById("app");

let learned, everWrong, queue, order, seen, firstTry, relearned, wrongHere, answered;

/* Progress is kept in this browser only, under one key. A question counts as
   mastered once it has been answered correctly at the first attempt of a
   showing; missing it puts it back to "shaky" until that happens.            */
const STORE_KEY = "ecn313-firm-analytical-solution-v1";
let mastered;            // stored: answered right at the first attempt, persisted
let touched;             // stored: has been seen at some point
let sessionResult;       // this session only: qid -> true/false, not yet saved
let savedThisVisit;      // has the student pressed Save during this visit

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.mastered) && o.mastered.length === QUESTIONS.length
         && Array.isArray(o.touched) && o.touched.length === QUESTIONS.length){
        mastered = o.mastered.slice(); touched = o.touched.slice(); return true;
      }
    }
  }catch(e){}
  return false;
}
/* What the stored record would become if the student chooses to save. */
function mergedMastered(){
  return mastered.map((m,i)=> i in sessionResult ? sessionResult[i] : m);
}
function mergedTouched(){
  return touched.map((t,i)=> (i in sessionResult) ? true : t);
}
function saveStore(){
  mastered = mergedMastered();
  touched  = mergedTouched();
  try{
    localStorage.setItem(STORE_KEY,
      JSON.stringify({mastered, touched, saved:Date.now()}));
    return true;
  }catch(e){ return false; }
}
function clearStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  mastered = new Array(QUESTIONS.length).fill(false);
  touched  = new Array(QUESTIONS.length).fill(false);
}
function hasHistory(){ return touched.some(Boolean); }
function notMastered(){ return QUESTIONS.map((_,i)=>i).filter(i=>!mastered[i]); }

function resetAll(){
  learned  = new Array(QUESTIONS.length).fill(false);
  everWrong= new Array(QUESTIONS.length).fill(false);
}

function initStore(){
  if(!loadStore()){
    mastered = new Array(QUESTIONS.length).fill(false);
    touched  = new Array(QUESTIONS.length).fill(false);
  }
}

function startSession(pool){
  queue = pool.slice();
  seen = new Set(); firstTry = new Set(); relearned = new Set();
  sessionResult = {}; savedThisVisit = false;
  nextQuestion();
}

function nextQuestion(){
  if(queue.length === 0){ renderEnd(true); return; }
  wrongHere = 0; answered = false;
  const qid = queue[0];
  order = shuffled(QUESTIONS[qid].options.map((_,i)=>i));
  renderQuestion(qid);
}

function shuffled(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

/* --------------------------------------------------------------- screens */
function renderHome(){
  const done = mastered.filter(Boolean).length;
  const left = notMastered();

  if(hasHistory()){
    app.innerHTML = `
      <div class="card">
        <p class="qmeta">Saved progress found on this device</p>
        <p class="stem">Last time you answered <b>${done}</b> of
          ${QUESTIONS.length} questions correctly at the first attempt.
          What would you like to practise?</p>
        <div class="row">
          ${left.length
            ? `<button class="btn" id="go-left">Only the ${left.length} I have not learned</button>`
            : ``}
          <button class="btn ${left.length ? "ghost" : ""}" id="go-all">All ${QUESTIONS.length} questions</button>
        </div>
        <div class="row">
          <button class="btn quiet" id="forget">Clear saved progress</button>
        </div>
        <p class="note" style="margin-top:.9rem">Progress is kept in this
          browser, on this device only, and never leaves it.</p>
      </div>`;
    document.getElementById("go-all").onclick =
      ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
    const bl = document.getElementById("go-left");
    if(bl) bl.onclick = ()=>{ resetAll(); startSession(left); };
    document.getElementById("forget").onclick =
      ()=>{ clearStore(); resetAll(); renderHome(); };
    return;
  }

  app.innerHTML = `
    <div class="card">
      <p class="stem">Twenty questions on the consumer's problem, in the order
        the notes cover them. Get one right first time and it is done. Get it
        wrong and you keep choosing until you find the answer &mdash; then that
        question comes back later in the session.</p>
      <p class="note">At the end you can save your progress on this device, so
        that next time you can practise just the ones you have not learned.</p>
      <div class="row">
        <button class="btn" id="go-all">Start practice session</button>
      </div>
    </div>`;
  document.getElementById("go-all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
}

function renderQuestion(qid){
  const q = QUESTIONS[qid];
  const total = QUESTIONS.length;
  const doneCount = learned.filter(Boolean).length;
  app.innerHTML = `
    <div class="bar"><div style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
    <div class="card">
      <p class="qmeta">Question ${qid+1} of ${total} &middot; ${queue.length} left this round</p>
      <p class="stem">${q.stem}</p>
      <ul class="options" id="opts">
        ${order.map((oi,pos)=>`
          <li><button class="opt" data-oi="${oi}">
            <span class="tag">(${LETTERS[pos]})</span><span>${q.options[oi]}</span>
          </button></li>`).join("")}
      </ul>
      <div id="verdict"></div>
      <div class="row">
        <div id="advance"></div>
        <div class="spacer"></div>
        <button class="btn quiet" id="end">End session</button>
      </div>
    </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>choose(qid, parseInt(b.dataset.oi,10), b);
  });
  document.getElementById("end").onclick = ()=>renderEnd(false);
}

function choose(qid, oi, btn){
  if(answered) return;
  const q = QUESTIONS[qid];
  const firstShowing = !seen.has(qid);
  seen.add(qid);
  touched[qid] = true;
  const verdict = document.getElementById("verdict");

  if(oi !== q.correct){
    everWrong[qid] = true; wrongHere++;
    sessionResult[qid] = false;
    btn.classList.add("wrong"); btn.disabled = true;
    const left = document.querySelectorAll("#opts .opt:not(:disabled)").length;
    verdict.innerHTML = `<div class="verdict no"><b>Not quite.</b>
      ${left > 1 ? "Try again — pick from what is left."
                 : "One option left; it has to be that one."}</div>`;
    return;
  }

  answered = true;
  btn.classList.add("right");
  document.querySelectorAll("#opts .opt").forEach(b=>b.disabled = true);

  let head, tail;
  if(wrongHere === 0){
    queue.shift();
    learned[qid] = true;
    if(everWrong[qid]){ relearned.add(qid); head = "Right — and that one is learned."; }
    else             { firstTry.add(qid);  head = "Correct, first time."; }
    if(firstShowing && !everWrong[qid] && !(qid in sessionResult)){
      sessionResult[qid] = true;
    }
    tail = "It will not come up again.";
  }else{
    queue.shift(); queue.push(qid);
    head = "That's the one.";
    tail = "This question will come back once the others have been through.";
  }
  verdict.innerHTML = `<div class="verdict ok"><b>${head}</b>${q.why}
    <span class="note"><br>${tail}</span></div>`;
  const adv = document.getElementById("advance");
  adv.innerHTML = `<button class="btn" id="next">${queue.length ? "Next question" : "Finish"}</button>`;
  document.getElementById("next").onclick = nextQuestion;
}

function renderEnd(cleared){
  const attempted = seen.size;
  const clean = firstTry.size;
  const fixed = relearned.size;
  const wouldBe = mergedMastered();
  const wouldLeft = wouldBe.map((m,i)=>i).filter(i=>!wouldBe[i]);
  const doneAfter = wouldBe.filter(Boolean).length;
  const anythingToSave = Object.keys(sessionResult).length > 0;

  app.innerHTML = `
    <div class="card">
      <p class="qmeta">${cleared ? "Round complete" : "Session ended"}</p>
      <p class="stem">${cleared
        ? "Everything in this round has been answered."
        : "Here is how the session went."}</p>
      <table class="stats">
        <tr><td>Questions attempted</td><td class="n">${attempted}</td></tr>
        <tr><td>Answered correctly at the first attempt</td><td class="n">${clean}</td></tr>
        <tr><td>Learned after getting it wrong first</td><td class="n">${fixed}</td></tr>
      </table>

      <div id="savebox">
      ${anythingToSave ? `
        <div class="verdict ok" style="margin-top:1rem">
          <b>Save your progress?</b>
          Saving records which questions you answered correctly at the first
          attempt, so that next time you can practise only the rest. It is kept
          <b>in this browser, on this device only</b> &mdash; nothing is sent
          anywhere.
        </div>
        <div class="row">
          <button class="btn" id="save">Save on this device</button>
          <button class="btn quiet" id="nosave">Don't save</button>
        </div>` : ``}
      </div>

      <div class="row" id="nextsteps">
        <button class="btn ghost" id="again">Practise the ${wouldLeft.length} not yet learned</button>
        <button class="btn ghost" id="all">Practise all ${QUESTIONS.length}</button>
        <button class="btn quiet" id="home">Back to start</button>
      </div>
    </div>`;

  const box = document.getElementById("savebox");
  const bs = document.getElementById("save");
  if(bs) bs.onclick = ()=>{
    const ok = saveStore();
    savedThisVisit = true;
    box.innerHTML = ok
      ? `<div class="verdict ok" style="margin-top:1rem"><b>Saved on this device.</b>
         ${doneAfter} of ${QUESTIONS.length} questions are recorded as learned.
         Next time you open this page you can pick up where you left off.</div>`
      : `<div class="verdict no" style="margin-top:1rem"><b>Could not save.</b>
         Your browser is blocking storage — private browsing usually does this.</div>`;
  };
  const bn = document.getElementById("nosave");
  if(bn) bn.onclick = ()=>{
    box.innerHTML = `<p class="note" style="margin-top:1rem">Nothing saved.
      Closing the page will clear this session.</p>`;
  };

  const againBtn = document.getElementById("again");
  if(wouldLeft.length === 0){ againBtn.remove(); }
  else againBtn.onclick = ()=>{ resetAll(); startSession(wouldLeft); };
  document.getElementById("all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
  document.getElementById("home").onclick = renderHome;
}

initStore();
resetAll();
renderHome();
</script>
</body>
</html>
