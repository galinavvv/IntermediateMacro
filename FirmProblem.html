<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermediate Macroeconomics — Firm decision problem practice</title>
<style>
  :root{
    --ink:#1A1A1C; --accent:#1F3A6E; --budget:#15607A; --ic:#B21F35;
    --note:#8A6212; --muted:#6B6E76; --rule:#D8DCE3; --paper:#FDFCFA;
    --panel:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",
                Georgia,serif;
    line-height:1.5; padding:1.5rem 1rem 4rem;
  }
  .wrap{max-width:46rem;margin:0 auto}
  header{border-top:3px solid var(--accent);padding-top:.9rem;margin-bottom:1.6rem}
  h1{font-size:1.5rem;margin:0 0 .2rem;color:var(--accent);letter-spacing:.01em}
  .sub{color:var(--muted);font-style:italic;font-size:.95rem;margin:0}
  .card{
    background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:1.2rem 1.3rem;margin-bottom:1.1rem;
  }
  .stem{font-size:1.06rem;margin:0 0 1rem}
  .qmeta{color:var(--muted);font-size:.82rem;letter-spacing:.04em;
         text-transform:uppercase;margin:0 0 .5rem}
  ul.options{list-style:none;margin:0;padding:0}
  ul.options li{margin:0 0 .5rem}
  button.opt{
    width:100%;text-align:left;font:inherit;font-size:1rem;
    background:#fff;border:1px solid var(--rule);border-radius:2px;
    padding:.62rem .8rem;cursor:pointer;color:var(--ink);
    display:flex;gap:.6rem;align-items:baseline;
  }
  button.opt:hover:not(:disabled){border-color:var(--budget);background:#F4F9FB}
  button.opt:disabled{cursor:default}
  button.opt .tag{color:var(--muted);font-variant:small-caps;min-width:1.2rem}
  button.opt.wrong{background:#FBF1F2;border-color:var(--ic);color:#8B4148;
                   text-decoration:line-through;text-decoration-thickness:1px}
  button.opt.right{background:#EFF6F8;border-color:var(--budget);color:var(--budget);
                   font-weight:600}
  .verdict{margin:1rem 0 0;padding:.7rem .85rem;font-size:.97rem;border-left:3px solid}
  .verdict.ok{border-color:var(--budget);background:#EFF6F8}
  .verdict.no{border-color:var(--ic);background:#FBF1F2}
  .verdict b{display:block;margin-bottom:.15rem}
  .btn{
    font:inherit;font-size:1rem;padding:.62rem 1.15rem;border-radius:2px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
  }
  .btn:hover{background:#162C55}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:#F2F5FA}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--rule)}
  .btn.quiet:hover{background:#F6F6F4;color:var(--ink)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.1rem}
  .spacer{flex:1}
  .bar{height:4px;background:var(--rule);margin:.3rem 0 1.4rem;overflow:hidden}
  .bar > div{height:100%;background:var(--budget);width:0;transition:width .25s}
  table.stats{border-collapse:collapse;width:100%;margin:.4rem 0 .2rem}
  table.stats td{padding:.42rem .2rem;border-bottom:1px solid var(--rule);font-size:1rem}
  table.stats td.n{text-align:right;font-weight:700;color:var(--accent);width:3.5rem}
  table.stats tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:.9rem}
  em.v{font-style:italic}
  footer{margin-top:2.2rem;color:var(--muted);font-size:.82rem;
         border-top:1px solid var(--rule);padding-top:.7rem}
  footer a{color:var(--muted)} footer a:hover{color:var(--accent)}
  @media (max-width:480px){ body{padding:1rem .7rem 3rem} h1{font-size:1.3rem} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Firm decision problem — practice</h1>
  <p class="sub">Intermediate Macroeconomics</p>
</header>

<div id="app"></div>

<footer>
  <a href="index.html">All practice quizzes</a> &middot;
  Your progress is saved in this browser, on this device only. Nothing is sent
  anywhere.
</footer>

</div>

<script>
/* ------------------------------------------------------------------ questions
   Order follows the chapter: the firm's problem, assumptions on technology,
   the revenue curve, the cost line and profit, the optimal choice of labor.
   correct = index into options.                                              */
const QUESTIONS = [
 {stem:"A firm turns inputs into output that it sells, and using inputs is costly. Which description matches the firm's decision problem?",
  options:[
   "Choose the inputs that maximize revenue, because cost is a fixed amount whatever the inputs",
   "Choose the inputs that maximize revenue minus cost, where both depend on the inputs",
   "Choose the inputs that minimize cost, because revenue does not depend on the inputs",
   "Choose the inputs that maximize output, whatever those inputs happen to cost"],
  correct:1,
  why:"Revenue comes from the output the inputs produce and cost comes from paying for them, so both depend on the inputs. The firm maximizes the difference, which is profit."},
 {stem:"In the firm's revenue <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>), what does <em class='v'>z</em> stand for?",
  options:[
   "Everything that affects output besides capital and labor (total factor productivity)",
   "The amount of labor the firm chooses to hire at the going wage",
   "The price at which the firm sells each unit of its output",
   "The share of the firm's output that is paid out to workers as wages"],
  correct:0,
  why:"<em class='v'>z</em> is the technology term, also called TFP. It multiplies <em class='v'>F</em> and stands for everything else that affects output in addition to capital and labor."},
 {stem:"A firm solves the problem of choosing <em class='v'>N</em> to maximize <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) &minus; <em class='v'>w</em><em class='v'>N</em>. Which description of its choice is correct?",
  options:[
   "It chooses labor <em class='v'>N</em> and capital <em class='v'>K</em>, and takes <em class='v'>z</em> and <em class='v'>w</em> as given",
   "It chooses labor <em class='v'>N</em> and the wage <em class='v'>w</em>, and takes <em class='v'>z</em> and <em class='v'>K</em> as given",
   "It chooses only labor <em class='v'>N</em>, and takes <em class='v'>z</em>, <em class='v'>K</em> and <em class='v'>w</em> as given",
   "It chooses labor <em class='v'>N</em> and technology <em class='v'>z</em>, and takes <em class='v'>K</em> and <em class='v'>w</em> as given"],
  correct:2,
  why:"Capital is owned by the firm and given for now, technology is a parameter, and the wage comes from the labor market. The only choice variable is labor <em class='v'>N</em>."},
 {stem:"A production function satisfies <em class='v'>F</em>(0, <em class='v'>N</em>) = <em class='v'>F</em>(<em class='v'>K</em>, 0) = 0. What does this say about the inputs?",
  options:[
   "With no labor and no capital at all the firm produces nothing, but either input alone is enough to produce",
   "Adding labor or capital to a firm that has either one never raises its output",
   "A firm that produces nothing also earns no profit and pays no wages",
   "With no labor, or with no capital, the firm produces no output"],
  correct:3,
  why:"Both inputs are essential: take away either one and output is zero. It says nothing about adding inputs, which is a separate assumption, and nothing about profit."},
 {stem:"What is the marginal product of labor?",
  options:[
   "The extra output the firm gets from hiring one more worker",
   "Total output divided by the number of workers the firm hires",
   "The extra revenue that is left once the extra worker has been paid",
   "The output the firm gives up when it uses one unit less of capital"],
  correct:0,
  why:"It is the output added by one more worker. Total output per worker is the average product, a different object, and the revenue left after paying the worker is a profit concept."},
 {stem:"Revenue <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) is plotted against labor <em class='v'>N</em>, with <em class='v'>z</em> and <em class='v'>K</em> fixed. At a given level of labor, the marginal product of labor is",
  options:[
   "the height of the revenue curve at that level of labor",
   "the slope of the revenue curve at that level of labor",
   "the slope of the straight line from the origin to the revenue curve at that level of labor",
   "the area under the revenue curve up to that level of labor"],
  correct:1,
  why:"The marginal product is the rate at which output rises as labor rises, which is the slope of the curve. The height is total revenue, and the slope of the line from the origin is the average product."},
 {stem:"Capital is held fixed and a firm keeps hiring workers. Diminishing returns to labor says that",
  options:[
   "each additional worker lowers total output",
   "each additional worker adds exactly as much to output as the one before",
   "each additional worker adds less to output than the one before",
   "each additional worker adds more to output than the one before"],
  correct:2,
  why:"Diminishing returns is about the size of the addition, not its sign: output still rises with each worker, but by less and less."},
 {stem:"Capital is held fixed. According to the model, why does each additional worker add less output than the one before?",
  options:[
   "Workers become less willing to work long hours as employment grows",
   "The wage falls as the firm hires more workers, so each worker is less productive",
   "Technology <em class='v'>z</em> falls as employment grows",
   "Every worker has less capital available to work with as the workforce grows"],
  correct:3,
  why:"With capital fixed, a larger workforce shares the same machines, so each added worker has less capital to use and adds less output."},
 {stem:"Under complementarity between capital and labor, what happens to the marginal product of labor when the firm's capital rises?",
  options:[
   "It falls, because capital takes over some of the workers' tasks",
   "It rises, because each worker has more capital to use",
   "It does not change, because capital and labor are separate inputs",
   "It rises only if the firm also hires more workers"],
  correct:1,
  why:"Complementarity means the two inputs raise each other's productivity: with more capital per worker, one more worker adds more output."},
 {stem:"A production function <em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) is smooth. One assumption says the marginal product of labor rises with capital. Another says the marginal product of capital rises with labor. How are the two related?",
  options:[
   "They are equivalent: both say that the cross-partial derivative of <em class='v'>F</em> is positive",
   "They are opposites: one implies diminishing returns and the other increasing returns",
   "They are independent: neither implies the other, since they concern different inputs",
   "They are equivalent only when the production function has constant returns to scale"],
  correct:0,
  why:"For a smooth function the order of the two partial derivatives does not matter, so the change in MP<sub><em class='v'>N</em></sub> with <em class='v'>K</em> and the change in MP<sub><em class='v'>K</em></sub> with <em class='v'>N</em> are both the cross-partial derivative of <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>)."},
 {stem:"Revenue <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) is plotted against labor <em class='v'>N</em>. If <em class='v'>F</em>(<em class='v'>K</em>, 0) = 0, what does the revenue curve do?",
  options:[
   "It rises at every level of labor, however much labor is hired",
   "It bends downward, so each worker adds less revenue than the last",
   "It starts at the origin, with zero revenue when there is no labor",
   "It starts at a positive height on the vertical axis before it rises"],
  correct:2,
  why:"With no labor there is no output, so the curve starts at zero. Whether it rises, and how it bends, are decided by other assumptions."},
 {stem:"The revenue curve <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) is increasing in labor <em class='v'>N</em>. Which assumption about technology is responsible?",
  options:[
   "Diminishing returns to labor",
   "Complementarity between capital and labor",
   "Constant returns to scale",
   "More inputs lead to more output"],
  correct:3,
  why:"A curve that rises with labor means output grows when labor grows: that is the assumption that more inputs lead to more output. Diminishing returns governs the bend, not the direction."},
 {stem:"Revenue <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) is plotted against labor <em class='v'>N</em>, and the marginal product of labor falls as <em class='v'>N</em> rises. What shape is the revenue curve?",
  options:[
   "Convex (bending upward), because its slope gets smaller as labor rises",
   "Concave (bending downward), because its slope gets smaller as labor rises",
   "A straight line, because each worker adds some output",
   "Decreasing, because each worker adds less output than the one before"],
  correct:1,
  why:"The slope of the revenue curve is the marginal product. A slope that shrinks as labor rises is a curve that bends downward, a concave curve, while still rising."},
 {stem:"Capital <em class='v'>K</em> rises while technology <em class='v'>z</em> stays fixed. The revenue curve <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) is plotted against labor <em class='v'>N</em>. How does it change?",
  options:[
   "It shifts up in parallel, keeping its slope at every level of labor",
   "It shifts down and becomes flatter at every level of labor",
   "It shifts up and becomes steeper at every level of labor",
   "It becomes steeper at low levels of labor and flatter at high levels"],
  correct:2,
  why:"More capital means more output at each level of labor (more inputs lead to more output) and a higher marginal product of labor (complementarity), so the curve is both higher and steeper."},
 {stem:"Technology <em class='v'>z</em> rises while capital <em class='v'>K</em> stays fixed. The revenue curve <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) is plotted against labor <em class='v'>N</em>. How does it change?",
  options:[
   "It shifts up in parallel, because <em class='v'>z</em> does not change the marginal product of labor",
   "It becomes flatter, because better technology saves on labor",
   "It does not move, because <em class='v'>z</em> is not an input the firm chooses",
   "It shifts up and becomes steeper at every level of labor"],
  correct:3,
  why:"<em class='v'>z</em> multiplies <em class='v'>F</em>, so output rises at every level of labor and so does the slope. A rise in <em class='v'>z</em> changes the curve in the way a rise in capital does."},
 {stem:"A firm takes technology <em class='v'>z</em>, capital <em class='v'>K</em>, the wage <em class='v'>w</em> and the function <em class='v'>F</em> as given and maximizes profit. Which list contains the three things the model predicts?",
  options:[
   "Labor <em class='v'>N</em>*, output <em class='v'>Y</em>* and profit &pi;*",
   "The wage <em class='v'>w</em>, labor <em class='v'>N</em>* and output <em class='v'>Y</em>*",
   "Capital <em class='v'>K</em>*, labor <em class='v'>N</em>* and profit &pi;*",
   "Technology <em class='v'>z</em>*, output <em class='v'>Y</em>* and profit &pi;*"],
  correct:0,
  why:"Technology, capital, the wage and <em class='v'>F</em> are parameters that go in. What comes out is the labor the firm hires, the output it produces with that labor, and the profit it earns."},
 {stem:"On a graph with labor <em class='v'>N</em> on the horizontal axis, the firm's cost of labor is <em class='v'>w</em><em class='v'>N</em>. What does the cost curve look like?",
  options:[
   "A straight line starting at height <em class='v'>w</em> on the vertical axis",
   "A straight line through the origin whose slope is the wage <em class='v'>w</em>",
   "A curve through the origin that gets steeper as <em class='v'>N</em> rises",
   "A horizontal line at height <em class='v'>w</em>"],
  correct:1,
  why:"Each unit of labor costs <em class='v'>w</em>, so cost is proportional to <em class='v'>N</em>: a straight line from the origin whose slope is the wage."},
 {stem:"Revenue <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) and the cost <em class='v'>w</em><em class='v'>N</em> are both plotted against labor <em class='v'>N</em>. How is the firm's profit at a given level of labor shown on the graph?",
  options:[
   "As the height of the revenue curve at that level of labor",
   "As the slope of the revenue curve minus the slope of the cost line",
   "As the vertical distance between the revenue curve and the cost line",
   "As the area between the two curves from the origin up to that level of labor"],
  correct:2,
  why:"Profit is revenue minus cost at that level of labor, which is the vertical gap between the two curves."},
 {stem:"Revenue <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) and the cost <em class='v'>w</em><em class='v'>N</em> are plotted against labor <em class='v'>N</em>, and the revenue curve crosses the cost line at a positive level of labor. What is the firm's profit there?",
  options:[
   "At its maximum, because the two curves meet there",
   "Negative, because the revenue curve is about to fall below the cost line",
   "Equal to the wage <em class='v'>w</em>, because the cost line has slope <em class='v'>w</em>",
   "Zero, because revenue equals cost there"],
  correct:3,
  why:"Profit is the gap between the curves, and the gap is zero where they cross. The maximum is elsewhere, where the gap is widest."},
 {stem:"Revenue <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) and the cost <em class='v'>w</em><em class='v'>N</em> are plotted against labor <em class='v'>N</em>. At the profit-maximizing level of labor, how do the slope of the revenue curve and the slope of the cost line compare?",
  options:[
   "The revenue curve is steeper: the marginal product of labor exceeds the wage",
   "They are equal: the marginal product of labor equals the wage",
   "The cost line is steeper: the wage exceeds the marginal product of labor",
   "They need not compare: profit is largest where the two curves cross"],
  correct:1,
  why:"The gap between the curves is widest where their slopes match, so MP<sub><em class='v'>N</em></sub> = <em class='v'>w</em>. At the crossing the gap is zero, not largest."},
 {stem:"A firm chooses <em class='v'>N</em> to maximize <em class='v'>z</em><em class='v'>F</em>(<em class='v'>K</em>, <em class='v'>N</em>) &minus; <em class='v'>w</em><em class='v'>N</em>. It currently hires a number of workers at which the marginal product of labor exceeds the wage. What does the model say about hiring one more worker?",
  options:[
   "It lowers profit, because the extra worker must be paid the wage",
   "It leaves profit unchanged, because revenue and cost both rise",
   "It raises profit, because the extra revenue exceeds the extra cost",
   "It raises profit only if the firm also raises capital <em class='v'>K</em>"],
  correct:2,
  why:"One more worker adds MP<sub><em class='v'>N</em></sub> to revenue and <em class='v'>w</em> to cost. When MP<sub><em class='v'>N</em></sub> is larger than <em class='v'>w</em>, profit rises, so the firm should hire until the two are equal."},
];

/* ---------------------------------------------------------------- state */
const LETTERS = ["a","b","c","d","e","f"];
const app = document.getElementById("app");

let learned, everWrong, queue, order, seen, firstTry, relearned, wrongHere, answered;

/* Progress is kept in this browser only, under one key. A question counts as
   mastered once it has been answered correctly at the first attempt of a
   showing; missing it puts it back to "shaky" until that happens.            */
const STORE_KEY = "ecn313-firm-problem-v1";
let mastered;            // stored: answered right at the first attempt, persisted
let touched;             // stored: has been seen at some point
let sessionResult;       // this session only: qid -> true/false, not yet saved
let savedThisVisit;      // has the student pressed Save during this visit

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.mastered) && o.mastered.length === QUESTIONS.length
         && Array.isArray(o.touched) && o.touched.length === QUESTIONS.length){
        mastered = o.mastered.slice(); touched = o.touched.slice(); return true;
      }
    }
  }catch(e){}
  return false;
}
/* What the stored record would become if the student chooses to save. */
function mergedMastered(){
  return mastered.map((m,i)=> i in sessionResult ? sessionResult[i] : m);
}
function mergedTouched(){
  return touched.map((t,i)=> (i in sessionResult) ? true : t);
}
function saveStore(){
  mastered = mergedMastered();
  touched  = mergedTouched();
  try{
    localStorage.setItem(STORE_KEY,
      JSON.stringify({mastered, touched, saved:Date.now()}));
    return true;
  }catch(e){ return false; }
}
function clearStore(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  mastered = new Array(QUESTIONS.length).fill(false);
  touched  = new Array(QUESTIONS.length).fill(false);
}
function hasHistory(){ return touched.some(Boolean); }
function notMastered(){ return QUESTIONS.map((_,i)=>i).filter(i=>!mastered[i]); }

function resetAll(){
  learned  = new Array(QUESTIONS.length).fill(false);
  everWrong= new Array(QUESTIONS.length).fill(false);
}

function initStore(){
  if(!loadStore()){
    mastered = new Array(QUESTIONS.length).fill(false);
    touched  = new Array(QUESTIONS.length).fill(false);
  }
}

function startSession(pool){
  queue = pool.slice();
  seen = new Set(); firstTry = new Set(); relearned = new Set();
  sessionResult = {}; savedThisVisit = false;
  nextQuestion();
}

function nextQuestion(){
  if(queue.length === 0){ renderEnd(true); return; }
  wrongHere = 0; answered = false;
  const qid = queue[0];
  order = shuffled(QUESTIONS[qid].options.map((_,i)=>i));
  renderQuestion(qid);
}

function shuffled(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

/* --------------------------------------------------------------- screens */
function renderHome(){
  const done = mastered.filter(Boolean).length;
  const left = notMastered();

  if(hasHistory()){
    app.innerHTML = `
      <div class="card">
        <p class="qmeta">Saved progress found on this device</p>
        <p class="stem">Last time you answered <b>${done}</b> of
          ${QUESTIONS.length} questions correctly at the first attempt.
          What would you like to practise?</p>
        <div class="row">
          ${left.length
            ? `<button class="btn" id="go-left">Only the ${left.length} I have not learned</button>`
            : ``}
          <button class="btn ${left.length ? "ghost" : ""}" id="go-all">All ${QUESTIONS.length} questions</button>
        </div>
        <div class="row">
          <button class="btn quiet" id="forget">Clear saved progress</button>
        </div>
        <p class="note" style="margin-top:.9rem">Progress is kept in this
          browser, on this device only, and never leaves it.</p>
      </div>`;
    document.getElementById("go-all").onclick =
      ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
    const bl = document.getElementById("go-left");
    if(bl) bl.onclick = ()=>{ resetAll(); startSession(left); };
    document.getElementById("forget").onclick =
      ()=>{ clearStore(); resetAll(); renderHome(); };
    return;
  }

  app.innerHTML = `
    <div class="card">
      <p class="stem">Twenty-one questions on the firm's decision problem, in the order
        the notes cover them. Get one right first time and it is done. Get it
        wrong and you keep choosing until you find the answer &mdash; then that
        question comes back later in the session.</p>
      <p class="note">At the end you can save your progress on this device, so
        that next time you can practise just the ones you have not learned.</p>
      <div class="row">
        <button class="btn" id="go-all">Start practice session</button>
      </div>
    </div>`;
  document.getElementById("go-all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
}

function renderQuestion(qid){
  const q = QUESTIONS[qid];
  const total = QUESTIONS.length;
  const doneCount = learned.filter(Boolean).length;
  app.innerHTML = `
    <div class="bar"><div style="width:${(doneCount/total*100).toFixed(1)}%"></div></div>
    <div class="card">
      <p class="qmeta">Question ${qid+1} of ${total} &middot; ${queue.length} left this round</p>
      <p class="stem">${q.stem}</p>
      <ul class="options" id="opts">
        ${order.map((oi,pos)=>`
          <li><button class="opt" data-oi="${oi}">
            <span class="tag">(${LETTERS[pos]})</span><span>${q.options[oi]}</span>
          </button></li>`).join("")}
      </ul>
      <div id="verdict"></div>
      <div class="row">
        <div id="advance"></div>
        <div class="spacer"></div>
        <button class="btn quiet" id="end">End session</button>
      </div>
    </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>choose(qid, parseInt(b.dataset.oi,10), b);
  });
  document.getElementById("end").onclick = ()=>renderEnd(false);
}

function choose(qid, oi, btn){
  if(answered) return;
  const q = QUESTIONS[qid];
  const firstShowing = !seen.has(qid);
  seen.add(qid);
  touched[qid] = true;
  const verdict = document.getElementById("verdict");

  if(oi !== q.correct){
    everWrong[qid] = true; wrongHere++;
    sessionResult[qid] = false;
    btn.classList.add("wrong"); btn.disabled = true;
    const left = document.querySelectorAll("#opts .opt:not(:disabled)").length;
    verdict.innerHTML = `<div class="verdict no"><b>Not quite.</b>
      ${left > 1 ? "Try again — pick from what is left."
                 : "One option left; it has to be that one."}</div>`;
    return;
  }

  answered = true;
  btn.classList.add("right");
  document.querySelectorAll("#opts .opt").forEach(b=>b.disabled = true);

  let head, tail;
  if(wrongHere === 0){
    queue.shift();
    learned[qid] = true;
    if(everWrong[qid]){ relearned.add(qid); head = "Right — and that one is learned."; }
    else             { firstTry.add(qid);  head = "Correct, first time."; }
    if(firstShowing && !everWrong[qid] && !(qid in sessionResult)){
      sessionResult[qid] = true;
    }
    tail = "It will not come up again.";
  }else{
    queue.shift(); queue.push(qid);
    head = "That's the one.";
    tail = "This question will come back once the others have been through.";
  }
  verdict.innerHTML = `<div class="verdict ok"><b>${head}</b>${q.why}
    <span class="note"><br>${tail}</span></div>`;
  const adv = document.getElementById("advance");
  adv.innerHTML = `<button class="btn" id="next">${queue.length ? "Next question" : "Finish"}</button>`;
  document.getElementById("next").onclick = nextQuestion;
}

function renderEnd(cleared){
  const attempted = seen.size;
  const clean = firstTry.size;
  const fixed = relearned.size;
  const wouldBe = mergedMastered();
  const wouldLeft = wouldBe.map((m,i)=>i).filter(i=>!wouldBe[i]);
  const doneAfter = wouldBe.filter(Boolean).length;
  const anythingToSave = Object.keys(sessionResult).length > 0;

  app.innerHTML = `
    <div class="card">
      <p class="qmeta">${cleared ? "Round complete" : "Session ended"}</p>
      <p class="stem">${cleared
        ? "Everything in this round has been answered."
        : "Here is how the session went."}</p>
      <table class="stats">
        <tr><td>Questions attempted</td><td class="n">${attempted}</td></tr>
        <tr><td>Answered correctly at the first attempt</td><td class="n">${clean}</td></tr>
        <tr><td>Learned after getting it wrong first</td><td class="n">${fixed}</td></tr>
      </table>

      <div id="savebox">
      ${anythingToSave ? `
        <div class="verdict ok" style="margin-top:1rem">
          <b>Save your progress?</b>
          Saving records which questions you answered correctly at the first
          attempt, so that next time you can practise only the rest. It is kept
          <b>in this browser, on this device only</b> &mdash; nothing is sent
          anywhere.
        </div>
        <div class="row">
          <button class="btn" id="save">Save on this device</button>
          <button class="btn quiet" id="nosave">Don't save</button>
        </div>` : ``}
      </div>

      <div class="row" id="nextsteps">
        <button class="btn ghost" id="again">Practise the ${wouldLeft.length} not yet learned</button>
        <button class="btn ghost" id="all">Practise all ${QUESTIONS.length}</button>
        <button class="btn quiet" id="home">Back to start</button>
      </div>
    </div>`;

  const box = document.getElementById("savebox");
  const bs = document.getElementById("save");
  if(bs) bs.onclick = ()=>{
    const ok = saveStore();
    savedThisVisit = true;
    box.innerHTML = ok
      ? `<div class="verdict ok" style="margin-top:1rem"><b>Saved on this device.</b>
         ${doneAfter} of ${QUESTIONS.length} questions are recorded as learned.
         Next time you open this page you can pick up where you left off.</div>`
      : `<div class="verdict no" style="margin-top:1rem"><b>Could not save.</b>
         Your browser is blocking storage — private browsing usually does this.</div>`;
  };
  const bn = document.getElementById("nosave");
  if(bn) bn.onclick = ()=>{
    box.innerHTML = `<p class="note" style="margin-top:1rem">Nothing saved.
      Closing the page will clear this session.</p>`;
  };

  const againBtn = document.getElementById("again");
  if(wouldLeft.length === 0){ againBtn.remove(); }
  else againBtn.onclick = ()=>{ resetAll(); startSession(wouldLeft); };
  document.getElementById("all").onclick =
    ()=>{ resetAll(); startSession(QUESTIONS.map((_,i)=>i)); };
  document.getElementById("home").onclick = renderHome;
}

initStore();
resetAll();
renderHome();
</script>
</body>
</html>
